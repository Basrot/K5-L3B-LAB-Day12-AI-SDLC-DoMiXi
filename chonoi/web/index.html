<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, transitioning = false;
const campaignUI = document.getElementById('campaign-ui');
const campaignHome = document.getElementById('campaign-home');
const lobbyMusic = document.getElementById('lobby-music');
let introFrame = 0, shopItem = null, campaignViewKey = '', musicMuted = false, musicAttempted = false;
const introImages = ['29-intro-father-teaches-text.png','30-intro-father-injured-text.png','31-intro-ut-sen-decides-text.png','32-intro-first-departure-text.png'];
async function campaignAction(action, extra={}) {
  const response = await fetch('/campaign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
  if (!response.ok) { const error=await response.json(); alert(error.error||'Không thể thực hiện'); return false; }
  campaignViewKey=''; return true;
}
function syncLobbyMusic(screen) {
  if (screen === 'title' || screen === 'map') {
    if (!musicMuted && !musicAttempted) { musicAttempted=true; lobbyMusic.play().catch(()=>{}); }
  } else {lobbyMusic.pause(); musicAttempted=false;}
}
document.addEventListener('pointerdown',()=>{
  if (snap?.campaign && ['title','map'].includes(snap.campaign.screen) && !musicMuted) lobbyMusic.play().catch(()=>{});
},{passive:true});
function renderCampaignUI() {
  const c = snap?.campaign;
  document.querySelector('nav').style.display = c ? 'none' : '';
  campaignHome.hidden = !c || c.screen !== 'playing';
  if (!c || c.screen === 'playing') { campaignUI.classList.remove('active'); syncLobbyMusic('playing'); return; }
  campaignUI.classList.add('active'); syncLobbyMusic(c.screen);
  campaignUI.dataset.screen=c.screen;
  const key=JSON.stringify([c.screen,c.day,c.wallet,c.stars,c.upgrades,c.result,introFrame,shopItem,musicMuted]);
  if(key===campaignViewKey)return;
  campaignViewKey=key;
  const bg = name => {campaignUI.style.backgroundImage=`url('/art/${name}')`;};
  let html='';
  if(c.screen==='title'){
    bg('24-title-screen.png');
    html=`<div class="campaign-panel"><h1>Quán Ăn Chợ Nổi</h1><p>Giữ quán sáng đèn cùng Út Sen</p><div class="campaign-actions">${c.can_resume?'<button data-campaign="resume">Tiếp tục lượt chơi</button>':''}<button data-campaign="start">Chọn màn</button><button data-campaign="replay_intro">Xem lại intro</button><button data-campaign="music">${musicMuted?'Bật nhạc':'Tắt nhạc'}</button></div></div>`;
  } else if(c.screen==='intro'){
    bg(introImages[introFrame]);
    html='<div class="campaign-panel"><div class="campaign-actions"><button data-campaign="next_intro">'+(introFrame<3?'Tiếp tục':'Bắt đầu hành trình')+'</button><button data-campaign="skip_intro">Bỏ qua</button><button data-campaign="title">Về sảnh</button></div></div>';
  } else if(c.screen==='map'){
    bg('25-level-select.png');
    const cards=Array.from({length:c.day_count},(_,i)=>{const n=i+1,open=n===1||(c.stars[String(n-1)]||0)>0,star=c.stars[String(n)]||0;return `<button data-campaign="day" data-day="${n}" ${open?'':'disabled'}>Màn ${n} · ${open?'☆'.repeat(3-star)+'★'.repeat(star):'🔒'}</button>`}).join('');
    html=`<div class="campaign-panel"><h2>Chọn màn</h2><p>Ví: ${c.wallet} xu · Uy tín: ${Number(c.reputation).toFixed(1)}</p><div class="campaign-grid">${cards}</div><div class="campaign-actions"><button data-campaign="shop">Cửa hàng</button><button data-campaign="replay_intro">Xem lại intro</button><button data-campaign="title">Về sảnh</button><button data-campaign="music">${musicMuted?'Bật nhạc':'Tắt nhạc'}</button></div></div>`;
  } else if(c.screen==='results'){
    bg('27-level-results.png');
    const r=c.result||{};
    html=`<div class="campaign-panel"><h2>Màn ${c.day} · ${'★'.repeat(r.stars||0)}${'☆'.repeat(3-(r.stars||0))}</h2><p>Phục vụ ${r.fulfilled_count||0} món đúng kế hoạch · Uy tín ${Number(r.reputation||0).toFixed(1)}</p><p>Khách trả ${r.earned_from_customers||0} xu · Sự kiện ${r.event_money_delta||0} xu · Thưởng ${r.bonus||0} xu</p><p>Xu thay đổi: <strong>${r.total_earned_this_day||0}</strong> · Ví hiện tại: ${c.wallet} xu</p><div class="campaign-actions"><button data-campaign="shop">Nâng cấp</button><button data-campaign="map">Chọn màn</button><button data-campaign="title">Về sảnh</button></div></div>`;
  } else if(c.screen==='shop'){
    bg(shopItem?'22-upgrade-detail-template.png':'16-upgrade-shop.png');
    if(!shopItem){
      const cards=Object.entries(c.upgrade_catalog).map(([id,item])=>`<button data-campaign="item" data-item="${id}">${item.label} · Cấp ${c.upgrades[id]+1}/3</button>`).join('');
      html=`<div class="campaign-panel"><h2>Cửa hàng · ${c.wallet} xu</h2><div class="campaign-grid">${cards}</div><div class="campaign-actions"><button data-campaign="map">Chọn màn</button><button data-campaign="title">Về sảnh</button></div></div>`;
    } else {
      const item=c.upgrade_catalog[shopItem], level=c.upgrades[shopItem];
      const rows=item.levels.map((l,i)=>{const state=i<=level?'Đã có':i===level+1?(c.wallet>=l.price?'Mua '+l.price+' xu':'Thiếu '+(l.price-c.wallet)+' xu'):'Mở sau cấp '+i;return `<button data-campaign="buy" data-item="${shopItem}" ${i===level+1&&c.wallet>=l.price?'':'disabled'}>Cấp ${i+1} · ${Object.entries(l).filter(([k])=>!['level','price'].includes(k)).map(([,v])=>v).join(' · ')} · ${state}</button>`}).join('');
      html=`<div class="campaign-panel"><h2>${item.label} · ${c.wallet} xu</h2><div class="campaign-grid">${rows}</div><div class="campaign-actions"><button data-campaign="back_shop">Quay lại</button><button data-campaign="map">Chọn màn</button><button data-campaign="title">Về sảnh</button></div></div>`;
    }
  }
  campaignUI.innerHTML=html;
}
campaignUI.addEventListener('click',async e=>{
  const b=e.target.closest('[data-campaign]');if(!b)return;
  const action=b.dataset.campaign;
  if(action==='music'){musicMuted=!musicMuted; if(musicMuted)lobbyMusic.pause();else {musicAttempted=true;lobbyMusic.play().catch(()=>{});}campaignViewKey='';renderCampaignUI();}
  else if(action==='replay_intro'){introFrame=0;await campaignAction('replay_intro');}
  else if(action==='next_intro'){if(introFrame<3){introFrame++;campaignViewKey='';renderCampaignUI();}else await campaignAction('intro_done');}
  else if(action==='skip_intro'){introFrame=0;await campaignAction('intro_done');}
  else if(action==='back_shop'){shopItem=null;campaignViewKey='';renderCampaignUI();}
  else if(action==='item'){shopItem=b.dataset.item;campaignViewKey='';renderCampaignUI();}
  else if(action==='day'){shopItem=null;await campaignAction('select_day',{day:Number(b.dataset.day)});}
  else if(action==='buy') await campaignAction('buy',{item:b.dataset.item});
  else {if(action==='shop')shopItem=null;if(action==='title'){introFrame=0;shopItem=null;}await campaignAction(action);}
});
campaignHome.addEventListener('click',async()=>{
  if(transitioning)return;
  down.clear();queue.length=0;lastSent='';resetQuanActors();
  await campaignAction('title');
});
// Hoạt ảnh khách đi vào từ cầu gỗ và rời quán (chỉ hiển thị client, không ảnh hưởng sim/headless)
const customerWalkIn = new Map();
const leavingCustomers = [];
let prevQuanCustomers = new Map();
let lastQuanTick = -1, quanSeenOnce = false;
function resetQuanActors() {
  customerWalkIn.clear();
  leavingCustomers.length = 0;
  prevQuanCustomers.clear();
  lastQuanTick = -1;
  quanSeenOnce = false;
}
function samplePath(pts, t) {
  const clamped = Math.max(0, Math.min(1, t));
  let total = 0;
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push([pts[i], pts[i + 1], len]);
    total += len;
  }
  if (!total) return { pos: pts[pts.length - 1], dx: 0 };
  let target = clamped * total;
  for (const [a, b, len] of segs) {
    if (target <= len || len === 0) {
      const f = len ? target / len : 1;
      return { pos: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], dx: b[0] - a[0] };
    }
    target -= len;
  }
  const last = segs[segs.length - 1];
  return { pos: pts[pts.length - 1], dx: last ? last[1][0] - last[0][0] : 0 };
}
function walkPathToSeat(seatX, seatZ, isPainted) {
  const gate = [7.75, 0.35], deck = [7.75, 2.5];
  if (isPainted) return [gate, deck, [10.8, Math.max(3.2, seatZ - 0.6)], [seatX, seatZ]];
  return [gate, deck, [seatX, seatZ]];
}
let audioContext = null, soundEnabled = false, lastSoundEvent = '';
let chaseSource = null, chaseBuffer = null, chaseLoading = null, audioTouched = false;
function loadChaseMusic() {
  if (!chaseLoading) chaseLoading = fetch('/art/chieu-troi-mua.mp3')
    .then(response => { if (!response.ok) throw new Error('Không tải được nhạc'); return response.arrayBuffer(); })
    .then(data => audioContext.decodeAudioData(data))
    .then(buffer => { chaseBuffer = buffer; })
    .catch(() => { chaseLoading = null; soundButton.title = 'Không tải được bài nhạc; hãy khởi động lại server'; });
  return chaseLoading;
}
let musicKey = '', musicTimer = null, musicVoices = [], musicStep = 0;
const weatherTunes = {
  sun: [60,64,67,72,67,64,62,67],
  rain: [48,55,51,55,50,57,53,57],
  snow: [84,79,81,76,79,74,76,72],
  fog: [48,49,55,0,51,50,55,0],
  wind: [72,60,74,62,76,64,71,59],
  bubbles: [72,79,84,79,74,81,86,81],
  fish_rain: [60,67,72,60,62,69,74,62],
  rainbow: [60,62,64,67,69,72,76,79],
  quan: [60,64,67,69,67,64,62,55]
};
function stopMusic() {
  clearInterval(musicTimer); musicTimer = null;
  musicVoices.forEach(voice => { try { voice.stop(); } catch (_) {} });
  musicVoices = [];
  if (chaseSource) { try { chaseSource.stop(); } catch (_) {} chaseSource.disconnect(); chaseSource = null; }
}
function syncMusic() {
  const key = !soundEnabled || document.hidden || !snap || snap.finished || transitioning ? ''
    : snap.mode === 'gather' && snap.pursuer?.active ? 'chase'
    : snap.mode === 'gather' ? snap.weather : 'quan';
  if (key === musicKey) return;
  stopMusic(); musicKey = key; musicStep = 0;
  if (!key || !audioContext) return;
  if (key === 'chase' && chaseBuffer) {
    chaseSource = audioContext.createBufferSource(); chaseSource.buffer = chaseBuffer; chaseSource.loop = true;
    const gain = audioContext.createGain(); gain.gain.value = .65;
    chaseSource.connect(gain); gain.connect(audioContext.destination);
    chaseSource.onended = () => gain.disconnect(); chaseSource.start();
    return;
  }
  if (key === 'chase') loadChaseMusic().then(() => { if (chaseBuffer && musicKey === 'chase') { musicKey = ''; syncMusic(); } });
  const melody = weatherTunes[key] || weatherTunes.sun;
  const beat = key === 'wind' || key === 'fish_rain' ? 180 : key === 'fog' ? 450 : 280;
  function note() {
    if (!soundEnabled || audioContext.state !== 'running') return;
    const pitch = melody[musicStep++ % melody.length];
    if (!pitch) return;
    const now = audioContext.currentTime, osc = audioContext.createOscillator(), gain = audioContext.createGain();
    osc.type = key === 'wind' || key === 'fish_rain' ? 'triangle' : 'sine';
    osc.frequency.value = 440 * 2 ** ((pitch-69)/12);
    gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.12,now+.025);
    gain.gain.exponentialRampToValueAtTime(.0001,now+beat/1000*.9);
    osc.connect(gain);gain.connect(audioContext.destination);
    musicVoices.push(osc);osc.onended=()=>{musicVoices=musicVoices.filter(v=>v!==osc);osc.disconnect();gain.disconnect();};
    osc.start(now);osc.stop(now+beat/1000);
  }
  note(); musicTimer = setInterval(note,beat);
}
document.addEventListener('visibilitychange',syncMusic);
const soundButton = document.getElementById('sound-toggle');
async function setSound(enabled) {
  audioTouched = true; soundEnabled = enabled;
  if (soundEnabled && !audioContext) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) audioContext = new AudioCtx(); else soundEnabled = false;
  }
  if (soundEnabled && audioContext.state === 'suspended') await audioContext.resume();
  soundButton.textContent = soundEnabled ? '🔊 Âm thanh' : '🔇 Âm thanh';
  soundButton.setAttribute('aria-pressed', String(soundEnabled));
  if (soundEnabled) playCue('water');
  if (soundEnabled) loadChaseMusic();
  syncMusic();
}
soundButton.textContent = '🔊 Bật nhạc';
soundButton.addEventListener('click', () => setSound(!soundEnabled));
function unlockSound(event) {
  if (!audioTouched && event.target !== soundButton) setSound(true);
  else if (soundEnabled && audioContext?.state === 'suspended') audioContext.resume().then(() => { musicKey = ''; syncMusic(); });
}
addEventListener('pointerdown',unlockSound);
addEventListener('keydown',unlockSound);
function playCue(kind) {
  if (!soundEnabled || !audioContext) return;
  const now = audioContext.currentTime;
  const notes = kind === 'water' ? [[310,.08,'sine'],[240,.11,'sine']]
    : kind === 'cooking' ? [[180,.1,'triangle'],[250,.14,'triangle']]
    : kind === 'ready' ? [[660,.12,'sine'],[880,.2,'sine']]
    : kind === 'served' ? [[520,.1,'sine'],[690,.1,'sine'],[820,.22,'sine']]
    : kind === 'rain' ? [[260,.13,'triangle'],[190,.2,'triangle']]
    : [[420,.12,'sine'],[580,.18,'sine']];
  notes.forEach(([hz,duration,type],i)=>{
    const osc=audioContext.createOscillator(),gain=audioContext.createGain();
    osc.type=type;osc.frequency.setValueAtTime(hz,now+i*.075);
    gain.gain.setValueAtTime(.0001,now+i*.075);gain.gain.exponentialRampToValueAtTime(.075,now+i*.075+.018);
    gain.gain.exponentialRampToValueAtTime(.0001,now+i*.075+duration);
    osc.connect(gain);gain.connect(audioContext.destination);osc.start(now+i*.075);osc.stop(now+i*.075+duration+.01);
  });
}
function hearEvents(events) {
  for(const e of events||[]) {
    const key=`${String(e.tick).padStart(8,'0')}:${e.name}:${e.data?.order_id||e.data?.fish_id||''}`;
    if(key<=lastSoundEvent)continue;
    lastSoundEvent=key;
    if(e.name==='dive'||e.name==='surface'||e.name==='fish_caught'||e.name==='treasure_picked')playCue('water');
    else if(e.name==='weather_changed'&&e.data?.weather==='rain')playCue('rain');
    else if(e.name==='cook_started')playCue('cooking');
    else if(e.name==='dish_ready'||e.name==='dish_picked')playCue('ready');
    else if(e.name==='served'||e.name==='paid')playCue('served');
  }
}

function itemName(kind) { return snap.catalog?.[kind]?.label || KIND_NAME[kind] || kind; }
function dishName(kind) { return snap.menu_labels?.[kind] || kind; }
function sprite(img, col, row, cols, rows, x, y, size, flip=false, angle=0) {
  if (!img.complete || !img.naturalWidth) return false;
  ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -1 : 1, 1); ctx.rotate(angle);
  const sw = img.naturalWidth / cols;
  const bands = img===propsArt ? [0,.224,.448,.648,1] : null;
  const sourceY = bands ? bands[row]*img.naturalHeight : row*img.naturalHeight/rows;
  const sh = bands ? (bands[row+1]-bands[row])*img.naturalHeight : img.naturalHeight/rows;
  ctx.drawImage(img, col * sw, sourceY, sw, sh, -size / 2, -size / 2, size, size);
  ctx.restore(); return true;
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
let eveningTransition = null;
async function enterEvening() {
  if (transitioning) return;
  transitioning = true;
  const counts = new Map();
  (snap.hold || []).forEach(kind => counts.set(kind, (counts.get(kind) || 0) + 1));
  eveningTransition = {started: performance.now(), items: [...counts], switched: false};
  down.clear(); queue.length = 0;
  await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({move:[0,0],interact:false,catch:false})});
  await new Promise(resolve => setTimeout(resolve, 2200));
  try {
    const response = await fetch(snap?.campaign?'/campaign':'/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(snap?.campaign?{action:'evening'}:{mode:'quan'})});
    if (!response.ok) throw new Error('Không mở được quán');
    eveningTransition.switched = true;
    eveningTransition.reveal = performance.now();
    await new Promise(resolve => setTimeout(resolve, 1600));
  } catch (e) { offline = true; }
  finally { eveningTransition = null; transitioning = false; lastSent = ''; }
}
document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click',async()=>{
  if (transitioning) return;
  if (snap?.mode === 'gather' && button.dataset.mode === 'quan' && button.dataset.demo !== 'true') {
    button.blur(); await enterEvening(); return;
  }
  down.clear(); queue.length=0;

  if (snap.collection) text('Bộ sưu tập dưới nước: ' + snap.collection.length + '/' + snap.collection_capacity,
                            w-14, 51, {size:13,align:'right',color:'#ffe3a3'});
  text((weatherText[snap.weather]||'')+' · '+Math.ceil((snap.weather_ticks_left||0)/60)+'s',14,78,{size:13,color:'#ffe1a2'});
  ctx.fillStyle='rgba(12,22,40,.82)';ctx.fillRect(w/2-Math.min(720,w-24)/2,h-175,Math.min(720,w-24),38);
  text(weatherText[snap.weather]||'',w/2,h-150,{size:Math.min(19,w/48),align:'center',color:'#ffedb5'});
  if(snap.weather_ticks_left<=180) text('Sắp đổi trời: '+(weatherText[snap.next_weather]||''),w/2,145,{size:16,align:'center',color:'#fff1bc'});
  text('Sông '+X+' m · '+(viewLeft<60?'Bến Sen':viewLeft<120?'Vùng Cồn Cá':'Khúc Sông Cổ'),14,99,{size:12,color:'#c5d4d8'});
  if(snap.pursuer?.hug_ticks_left>0){ctx.fillStyle='rgba(80,20,18,.82)';ctx.fillRect(w/2-Math.min(w-20,450)/2,top+5,Math.min(w-20,450),28);
    text('BỊ ÔM! Chờ Chú Áo Vàng buông ra',w/2,top+24,{size:13,align:'center',color:'#ffe778'});}
  else if(snap.pursuer?.active){ctx.fillStyle='rgba(15,31,35,.75)';ctx.fillRect(w/2-Math.min(w-20,450)/2,top+5,Math.min(w-20,450),28);
    text('CHẠY! Chú Áo Vàng đang đuổi · chạm mất 1 HP',w/2,top+24,{size:13,align:'center',color:'#ffcf71'});}
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    const stacks = [], byKind = new Map();
    snap.hold.forEach((kind) => {
      if (!byKind.has(kind)) { const stack = { kind, count: 0 }; byKind.set(kind, stack); stacks.push(stack); }
      byKind.get(kind).count++;
    });
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const stack = stacks[i];
      if (stack) {
        if (!itemSprite(stack.kind,x0+sz/2,y0+sz/2,sz-2)) {
          ctx.fillStyle = kc(stack.kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        }
        const badge = `x${stack.count}`, bw = Math.max(18, badge.length * 7 + 6);
        ctx.fillStyle = 'rgba(18,25,29,.9)'; ctx.fillRect(x0 + sz - bw + 2, y0 + sz - 12, bw, 12);
        text(badge,x0+sz-1,y0+sz-2,{size:9,align:'right',color:'#fff4c8'});
      }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => itemName(k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("S ↓ lặn · W ↑ nổi · A/D bơi · E nhặt/hái/cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function pill(s, x, y, o = {}) {
  const sz = o.size || 11;
  ctx.font = `600 ${sz}px system-ui, sans-serif`;
  const padX = 7, h = sz + 7;
  const w = ctx.measureText(s).width + padX * 2;
  ctx.fillStyle = o.bg || "rgba(26, 15, 7, 0.78)";
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = o.border || "rgba(240, 200, 128, 0.55)";
  ctx.lineWidth = 1;
  ctx.stroke();
  text(s, x, y + sz * 0.35, { size: sz, align: "center", color: o.color || "#fff5da" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 112, bottom = 60;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const hasBg = quanArt.complete && quanArt.naturalWidth > 0;
  if (hasBg) {
    ctx.drawImage(quanArt, sx(0), sy(Z), X * s, Z * s);
  } else {
    ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    for(let z=0;z<Z;z+=.5){ctx.strokeStyle='rgba(80,42,18,.15)';ctx.beginPath();ctx.moveTo(sx(0),sy(z));ctx.lineTo(sx(X),sy(z));ctx.stroke();}
  }
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 3; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  pill('QUÁN ÚT SEN · NHÀ BÈ CHỢ NỔI', sx(X / 2), sy(Z) + 18, { size: 13, color: '#ffe8a8' });
  // bếp (khớp 2 bếp lò trong nền ảnh quán)
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const col = st.state === "cooking" ? "#f59e0b" : st.state === "ready" ? "#4ade80" : "#cbd5e1";
    if (!hasBg || !st.painted) {
      const cell = st.state === 'cooking' ? 1 : st.state === 'ready' ? 2 : 0;
      if (!sprite(propsArt, cell, 1, 4, 4, bx, by, 1.8 * s)) {
        ctx.fillStyle = col; ctx.fillRect(bx - 0.8 * s, by - 0.8 * s, 1.6 * s, 1.6 * s);
      }
    } else if (st.state !== 'idle') {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.shadowColor = col;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(bx, by, 0.72 * s + Math.sin(snap.tick / 7) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    const dishId = typeof st.dish === 'string' ? st.dish : st.dish?.dish_id;
    if (st.state === 'ready' && dishId) {
      const cell = dishCell[dishId] ?? 0;
      sprite(dishesArt, cell % 4, Math.floor(cell / 4), 4, 2, bx, by - 0.1 * s, 0.95 * s);
    }
    const statusText = st.state === 'cooking'
      ? `${st.id} · Nấu ${Math.ceil((st.cook_ticks_left || 0) / 60)}s`
      : st.state === 'ready' ? `${st.id} · E lấy món!` : `${st.id} · E nấu`;
    pill(statusText, bx, by + 0.92 * s, {
      size: 11,
      color: st.state === 'ready' ? '#a7f3d0' : st.state === 'cooking' ? '#fde68a' : '#fff5da',
      border: col,
    });
    if (dishId) pill(dishName(dishId), bx, by - 0.95 * s, { size: 10, color: '#ffe7b3' });
  });
  // đồng bộ trạng thái khách đi vào từ cầu gỗ & khách rời quán (chỉ hiệu ứng hiển thị)
  if (snap.tick < lastQuanTick) resetQuanActors();
  lastQuanTick = snap.tick;
  const tableMap = {};
  (snap.tables || []).forEach((tb) => (tableMap[tb.id] = tb));
  const curIds = new Set();
  (snap.customers || []).forEach((c) => {
    curIds.add(c.id);
    const tb = tableMap[c.table_id];
    const isPainted = hasBg && tb?.painted;
    const seatX = tb ? (isPainted ? tb.pos[0] + 1.15 : tb.pos[0]) : 8;
    const seatZ = tb ? (isPainted ? tb.pos[1] + 0.08 : tb.pos[1] + 0.92) : 5;
    if (!customerWalkIn.has(c.id)) {
      const startTick = (!quanSeenOnce && snap.tick > 150) ? snap.tick - 999 : snap.tick;
      customerWalkIn.set(c.id, {
        startTick,
        duration: 95,
        path: walkPathToSeat(seatX, seatZ, isPainted),
      });
    }
    prevQuanCustomers.set(c.id, {
      id: c.id, label: c.label || c.id, sprite: c.sprite || 0,
      seatX, seatZ, isPainted,
    });
  });
  quanSeenOnce = true;
  for (const [id, info] of Array.from(prevQuanCustomers.entries())) {
    if (!curIds.has(id)) {
      const paidEv = (snap.events || []).find(e => e.name === 'paid' && (e.data?.order_id === id || e.data?.customer_id === id));
      const leftEv = (snap.events || []).find(e => e.name === 'customer_left' && (e.data?.order_id === id || e.data?.customer_id === id));
      const revPath = walkPathToSeat(info.seatX, info.seatZ, info.isPainted).slice().reverse();
      leavingCustomers.push({
        ...info,
        startTick: snap.tick,
        duration: 85,
        path: revPath,
        note: paidEv ? `Cảm ơn! +${paidEv.data?.amount ?? ''}k ✦` : leftEv ? 'Chờ lâu quá…' : 'Hẹn gặp lại!',
        happy: Boolean(paidEv),
      });
      prevQuanCustomers.delete(id);
      customerWalkIn.delete(id);
    }
  }
  for (let i = leavingCustomers.length - 1; i >= 0; i--) {
    if (snap.tick - leavingCustomers[i].startTick > leavingCustomers[i].duration + 12) leavingCustomers.splice(i, 1);
  }

  // bàn + khách (T1–T3 nằm đúng 3 bàn gỗ trên ảnh nền, khách ngồi ghế bên phải; T4 vẽ thêm trên sàn gỗ)
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  const walkingInDraw = [];
  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const isPainted = hasBg && tb.painted;
    if (!isPainted) {
      sprite(propsArt, 0, 2, 4, 4, tx, ty, 2.2 * s);
    }
    const c = byTable[tb.id];
    if (c) {
      const anim = customerWalkIn.get(c.id);
      const progress = anim ? Math.min(1, (snap.tick - anim.startTick) / anim.duration) : 1;
      if (progress < 1) {
        // Khách đang đi từ cầu gỗ vào bàn: hiện nhãn bàn đang giữ chỗ + vẽ nhân vật đi bộ ở lớp trên
        pill(`${tb.label || tb.id} · Khách đang tới`, isPainted ? tx - 0.25 * s : tx, ty + 0.62 * s, { size: 9.5, color: '#fde68a' });
        walkingInDraw.push({ c, anim, progress });
        return;
      }
      // Đã ngồi vào ghế: dùng sprite NGỒI (16-seated-waiting.png khi chờ, 13-dining-cast.png khi ăn/uống)
      const cx = isPainted ? tx + 1.15 * s : tx;
      const cy = isPainted ? ty - 0.08 * s : ty - 0.92 * s;
      const flip = isPainted;
      const drinking = c.state === 'eating' && c.eat_ticks_left < (meta.eat_s || 10) * 30;
      const served = (snap.events || []).some(e => e.name === 'served' && (e.data?.order_id === c.id || e.data?.customer_id === c.id) && snap.tick - e.tick < 90);
      const eating = c.state === 'eating';
      const waitingKitchen = c.order_status === 'assigned' || c.state === 'assigned';
      const bob = eating ? Math.sin(snap.tick / 7) * 2.2 : served ? Math.sin(snap.tick / 3) * 3.5 : Math.sin(snap.tick / 20) * 1.0;
      const bite = eating && !drinking && Math.floor(snap.tick / 18) % 2 === 0;
      const seatSize = 1.48 * s;
      if (eating) {
        sprite(diningArt, c.sprite || 0, drinking ? 1 : 0, 4, 2, cx, cy + bob, seatSize, flip, bite ? -.03 : .015);
      } else {
        const waitRow = waitingKitchen ? 1 : 0;
        if (!sprite(seatedArt, c.sprite || 0, waitRow, 4, 2, cx, cy + bob, seatSize, flip, served ? -.03 : 0)) {
          sprite(diningArt, c.sprite || 0, 0, 4, 2, cx, cy + bob, seatSize, flip, 0);
        }
      }
      if (served) { ctx.fillStyle = '#ffd45c'; ctx.font = `${Math.max(12, Math.min(20, s * .55))}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('✦', cx, cy - s * .72 + bob); }
      const cState = c.state === 'eating' ? (drinking ? 'Uống ' + (c.drink || 'trà') : 'Đang ăn')
        : waitingKitchen ? 'Chờ bếp' : 'Gọi món';
      const labelX = isPainted ? tx - 0.25 * s : tx;
      pill(`${c.label || c.id} · ${cState}`, labelX, ty - 0.56 * s, { size: 10, color: '#fff4d4' });
      if (eating) {
        const cell = drinking ? 7 : (dishCell[c.dish_id] ?? 0);
        sprite(dishesArt, cell % 4, Math.floor(cell / 4), 4, 2, tx - 0.1 * s, ty - 0.05 * s, 0.88 * s);
      } else if (c.patience_ticks_left !== undefined) {
        const frac = c.patience_ticks_left / patMax;
        bar(labelX - 0.75 * s, ty + 0.34 * s, 1.5 * s, 5, frac, frac < 0.25 ? '#ef4444' : frac < 0.5 ? '#f59e0b' : '#4ade80');
      }
      pill(dishName(c.dish_id), labelX, ty + 0.62 * s, { size: 9.5, color: '#ffe5a3' });
    } else {
      pill(tb.label || tb.id, tx, ty + 0.62 * s, { size: 10, color: '#f1e3c6' });
    }
  });
  // khách đang đi từ cầu gỗ vào quán (dùng sprite đi bộ đứng ở propsArt hàng 3 + bóng chân + nhịp bước)
  walkingInDraw.forEach(({ c, anim, progress }) => {
    const { pos, dx } = samplePath(anim.path, progress);
    const wx = sx(pos[0]), wy = sy(pos[1]);
    const stepBounce = Math.abs(Math.sin(snap.tick * 0.24)) * 5;
    const sway = Math.sin(snap.tick * 0.24) * 0.06;
    const fadeIn = Math.min(1, progress * 5);
    ctx.save();
    ctx.globalAlpha = fadeIn;
    ctx.fillStyle = "rgba(25, 12, 4, 0.28)";
    ctx.beginPath(); ctx.ellipse(wx, wy + 0.45 * s, 0.45 * s, 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();
    sprite(propsArt, c.sprite || 0, 3, 4, 4, wx, wy - 0.12 * s - stepBounce, 1.52 * s, dx < -0.05, sway);
    pill(`${c.label || c.id} · Đang vào quán`, wx, wy - 1.05 * s - stepBounce, { size: 10, color: '#fef08a', border: '#eab308' });
    ctx.restore();
  });
  // khách ăn xong / rời bàn đi ngược ra cầu gỗ
  leavingCustomers.forEach((lc) => {
    const p = Math.min(1, (snap.tick - lc.startTick) / lc.duration);
    const { pos, dx } = samplePath(lc.path, p);
    const wx = sx(pos[0]), wy = sy(pos[1]);
    const stepBounce = Math.abs(Math.sin(snap.tick * 0.24)) * 5;
    const sway = Math.sin(snap.tick * 0.24) * 0.06;
    const alpha = p > 0.8 ? Math.max(0, (1 - p) * 5) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(25, 12, 4, 0.25)";
    ctx.beginPath(); ctx.ellipse(wx, wy + 0.45 * s, 0.42 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();
    sprite(propsArt, lc.sprite || 0, 3, 4, 4, wx, wy - 0.12 * s - stepBounce, 1.48 * s, dx < -0.05, sway);
    pill(lc.note, wx, wy - 1.05 * s - stepBounce, {
      size: 10,
      color: lc.happy ? '#bbf7d0' : '#fecaca',
      border: lc.happy ? '#4ade80' : '#ef4444',
    });
    ctx.restore();
  });

  // Khá Bảnh (đi vào, thu bảo kê xong rời quán, hoặc bị công an bắt)
  if (snap.kha_banh && snap.kha_banh.active) {
    const kb = snap.kha_banh;
    const kx = sx(kb.pos[0]), ky = sy(kb.pos[1]);
    const arrested = kb.state === 'arrested';
    const action = kb.action_ticks > 0;
    const leaving = kb.state === 'leaving';
    const row = (arrested || action) ? 1 : 0;
    const col = arrested ? 2 : (action ? (Math.floor(snap.tick / 6) % 4) : (Math.floor(snap.tick / 8) % 4));
    const bob = action ? Math.sin(snap.tick / 3) * 5 : Math.sin(snap.tick / 8) * 2;
    sprite(khaBanhArt, col, row, 4, 2, kx, ky + bob - 0.45 * s, 1.9 * s, kb.facing_left);
    const tag = arrested ? '🚨 BẢNH BỊ BẮT!' : (action ? '💸 ĐÃ THU BẢO KÊ (rời quán)' : (leaving ? 'Khá Bảnh (rời quán)' : 'Khá Bảnh'));
    const color = arrested ? '#ff1744' : (action ? '#ff9100' : '#fbc02d');
    pill(tag, kx, ky - 1.25 * s + bob, { size: (arrested || action) ? 12 : 10.5, color, border: color });
    if (action) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = `${Math.max(12, Math.min(18, s * 0.65))}px system-ui`;
      ctx.textAlign = 'center';
      const sparkX = kx + Math.sin(snap.tick / 4) * s * 0.7;
      const sparkY = ky - s * 0.5 + Math.cos(snap.tick / 4) * s * 0.4;
      ctx.fillText('💸 -50k', sparkX, sparkY);
    }
  }

  // Chú Công An tuần tra & bảo vệ quán
  if (snap.cong_an && snap.cong_an.active) {
    const ca = snap.cong_an;
    const cx = sx(ca.pos[0]), cy = sy(ca.pos[1]);
    const chasing = ca.state === 'chasing';
    const escorting = ca.state === 'escorting';
    const row = (chasing || escorting) ? 1 : 0;
    const col = chasing ? 3 : (escorting ? 2 : (Math.floor(snap.tick / 8) % 4));
    const bob = chasing ? Math.sin(snap.tick / 2) * 5 : Math.sin(snap.tick / 8) * 2;
    sprite(congAnArt, col, row, 4, 2, cx, cy + bob - 0.45 * s, 1.9 * s, ca.facing_left);
    const caTag = chasing ? '🚨 ĐANG BẮT KHÁ BẢNH!' : (escorting ? '👮‍♂️ DẪN GIẢI VỀ ĐỒN' : '👮‍♂️ Chú Công An (E báo tin)');
    const caColor = chasing ? '#ff1744' : (escorting ? '#00e676' : '#69f0ae');
    pill(caTag, cx, cy - 1.25 * s + bob, { size: (chasing || escorting) ? 12 : 10.5, color: caColor, border: caColor });
  }

  // Banner thông báo sự kiện đặc biệt
  const specialEv = (snap.events || []).slice().reverse().find(e =>
    ['bao_ke_hit', 'police_alerted', 'kha_banh_arrested', 'police_friendly', 'kha_banh_left'].includes(e.name) && snap.tick - e.tick < 160
  );
  if (specialEv) {
    const isDanger = ['bao_ke_hit', 'police_alerted'].includes(specialEv.name);
    const isSuccess = specialEv.name === 'kha_banh_arrested';
    ctx.fillStyle = isDanger ? 'rgba(211, 47, 47, .92)' : (isSuccess ? 'rgba(46, 125, 50, .95)' : 'rgba(30, 80, 100, .9)');
    const boxW = Math.min(w - 20, 560);
    ctx.fillRect(w / 2 - boxW / 2, top + 5, boxW, 30);
    const msg = specialEv.data?.quote || (specialEv.name === 'kha_banh_arrested' ? 'Đã bắt Khá Bảnh (+50k thưởng, +0.5 uy tín)!' : 'Sự kiện');
    text((isDanger ? '⚠️ ' : (isSuccess ? '⭐ ' : '📢 ')) + msg, w / 2, top + 25, {
      size: 13,
      align: 'center',
      color: '#fff'
    });
  }

  // người chơi (phục vụ di chuyển trên sàn gỗ quán)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const vel = p.vel || [0, 0];
    const flipP = vel[0] < -0.05;
    if (snap.invuln_ticks > 0 && Math.floor(snap.tick / 4) % 2 === 0) {
      ctx.strokeStyle = "rgba(255, 82, 82, .85)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px, py - 0.42 * s, 0.95 * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255, 240, 185, 0.55)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    sprite(surfaceArt, 0, 0, 4, 3, px, py - .42 * s, 1.75 * s, flipP);
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      const cell = dishCell[hand] ?? 0;
      sprite(dishesArt, cell % 4, Math.floor(cell / 4), 4, 2, px + (flipP ? -.55 : .55) * s, py - .48 * s, .85 * s);
      pill('Đang bưng: ' + dishName(hand), px, py - 1.45 * s, { size: 11, color: '#fef08a', border: '#f59e0b' });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0} xu · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  const stock = snap.stock ? Object.keys(snap.stock).map((k) => itemName(k) + "×" + snap.stock[k]).join(", ") : "";
  text("Kho: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#cfd8dc" });
  text(snap.demo_stock?'QUÁN MẪU · kho nguyên liệu có sẵn để thử':'QUÁN CỦA BẠN · nguyên liệu mang từ sông',14,78,{size:12,color:'#e4c58f'});
  text('E tại bếp: nấu → lấy món khi chín · E tại đúng bàn: phục vụ · khách tự ăn/uống và trả tiền',14,99,{size:12,color:'#b9d9d6'});
  if(!Object.keys(snap.stock||{}).length && !(snap.customers||[]).length)text('Kho trống: ra sông bắt cá/hái rau, hoặc chọn Quán mẫu',w/2,h-35,{size:14,align:'center',color:'#ffd181'});
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function drawEveningTransition(w, h) {
  const t = eveningTransition;
  if (!t) return;
  const elapsed = (performance.now() - t.started) / 1000;
  const reveal = t.switched ? Math.min(1, (performance.now() - t.reveal) / 1600) : 0;
  const alpha = Math.min(1, elapsed / .65) * (1 - reveal);
  ctx.save(); ctx.globalAlpha = alpha;
  if (sunsetArt.complete && sunsetArt.naturalWidth) ctx.drawImage(sunsetArt,0,0,w,h);
  else { const sky = ctx.createLinearGradient(0,0,0,h); sky.addColorStop(0,'#17213f'); sky.addColorStop(.6,'#71415b'); sky.addColorStop(1,'#d38b59'); ctx.fillStyle=sky; ctx.fillRect(0,0,w,h); }
  ctx.fillStyle=`rgba(13,18,38,${Math.min(.62,elapsed*.18)})`;ctx.fillRect(0,0,w,h);
  for (let i=0;i<35;i++) { ctx.globalAlpha = alpha*(.35+.35*Math.sin(elapsed*2+i)); ctx.fillRect((i*137+39)%w,(i*67+15)%(h*.42),2,2); }
  ctx.globalAlpha = alpha;
  text('TẠM BIỆT BUỔI SÁNG',w/2,h*.28,{size:18,align:'center',color:'#f2c7a3'});
  text('Đèn lên rồi, mở quán thôi!',w/2,h*.36,{size:Math.min(32,w/20),align:'center',color:'#fff1cb'});
  text('Nguyên liệu mang về từ sông',w/2,h*.44,{size:17,align:'center',color:'#ffe0be'});
  const cols = Math.max(1,Math.min(6,Math.floor(w/115))), size = Math.min(90,w/cols-12);
  t.items.forEach(([kind,count],i) => {
    const row = Math.floor(i/cols), n = Math.min(cols,t.items.length-row*cols);
    const x = w/2 + (i%cols-(n-1)/2)*(size+16), y = h*.55+row*110;
    ctx.fillStyle='rgba(20,25,42,.55)'; ctx.fillRect(x-size/2,y-35,size,95);
    itemSprite(kind,x,y-5,48);
    text('x'+count,x+size/2-7,y+15,{size:16,align:'right',color:'#fff0b4'});
    text(itemName(kind),x,y+45,{size:12,align:'center',color:'#fff1dd'});
  });
  if (!t.items.length) text('Giỏ chưa có nguyên liệu',w/2,h*.59,{size:18,align:'center',color:'#ffe0be'});
  text(t.switched ? 'Chào buổi tối · Quán Út Sen' : 'Chuẩn bị bếp và mang nguyên liệu vào kho…',w/2,h-40,{size:15,align:'center',color:'#ffe9cd'});
  ctx.restore();
}
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    if(new URLSearchParams(location.search).has('debug'))eventLog(w, h);
    overlay(w, h);
    drawEveningTransition(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
