<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>

  body.high-contrast .campaign-panel,body.high-contrast dialog{background:#000 !important;color:#fff !important;border:3px solid #ffea00 !important;box-shadow:0 0 0 2px #000}

<body>
<canvas id="c"></canvas>
<nav aria-label="Chọn cảnh"><button data-mode="gather">☀ Sông</button><button data-mode="quan">♨ Quán · đem giỏ vào</button><button data-mode="quan" data-demo="true">Quán mẫu</button><button id="sound-toggle" aria-pressed="false">🔇 Âm thanh</button></nav>

<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, transitioning = false;
const campaignUI = document.getElementById('campaign-ui');
const campaignHome = document.getElementById('campaign-home');
const campaignEvening = document.getElementById('campaign-evening');
const lobbyMusic = document.getElementById('lobby-music');
lobbyMusic.volume = .6;
let introFrame = 0, shopItem = null, campaignViewKey = '', musicMuted = false, musicAttempted = false;
const introImages = ['29-intro-father-teaches-text.png','30-intro-father-injured-text.png','31-intro-ut-sen-decides-text.png','32-intro-first-departure-text.png'];
async function campaignAction(action, extra={}) {
  const response = await fetch('/campaign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});
  if (!response.ok) { const error=await response.json(); alert(error.error||'Không thể thực hiện'); return false; }
  campaignViewKey=''; return true;
}
function syncLobbyMusic(screen) {
  if (['title','map','intro','equipment','shop'].includes(screen)) {
    if (!musicMuted && !musicAttempted) { musicAttempted=true; playIntroMusic(); }
  } else {lobbyMusic.pause(); musicAttempted=false;}
}
function playIntroMusic() {
  lobbyMusic.muted = false;
  return lobbyMusic.play().catch(()=>{
    const button=campaignUI.querySelector('[data-campaign="music"]');
    if(button) button.textContent='🔊 Bấm để phát nhạc intro';
  });
}
document.addEventListener('pointerdown',event=>{
  if(event.target.closest('[data-campaign="music"]')) return;
  if (snap?.campaign && ['title','map','intro','equipment','shop'].includes(snap.campaign.screen) && !musicMuted) playIntroMusic();
},{passive:true});
function renderCampaignUI() {
  const c = snap?.campaign;
  const viewResBtn = document.getElementById('view-reservations');
  viewResBtn.hidden = !!c && c.screen !== 'playing';
  viewResBtn.style.top = c ? '56px' : '102px';
  const controls=document.getElementById('shift-actions');
  const controlsKey=(c?.screen||'')+snap.mode;
  if(controls.dataset.key!==controlsKey){
  controls.dataset.key=controlsKey;
  controls.innerHTML=c?.screen==='playing'?(snap.mode==='gather'?'<button id="early-shift">🌙 Về quán buổi tối</button>':'<button id="show-menu">📜 Xem món và giá</button> <button id="early-shift">🌃 Đóng quán sớm · demo</button>'):'';
  document.getElementById('early-shift')?.addEventListener('click',()=>snap.mode==='gather'?enterEvening():campaignAction('close_evening'));
  document.getElementById('show-menu')?.addEventListener('click',()=>{
    document.getElementById('menu-content').innerHTML=Object.entries(snap.menu_catalog||{}).map(([id,dish])=>`<p><strong>${dishName(id)}</strong> · ${dish.price} xu<br><small>${Object.entries(dish.recipe).map(([kind,n])=>itemName(kind)+' ×'+n).join(', ')}</small></p>`).join('');
    document.getElementById('menu-dialog').showModal();
  });
  }
  document.querySelector('nav').style.display = c ? 'none' : '';
  campaignHome.hidden = !c || c.screen !== 'playing';
  campaignEvening.hidden = true;
  if (!c || c.screen === 'playing') { campaignUI.classList.remove('active'); syncLobbyMusic('playing'); return; }
  campaignUI.classList.add('active'); syncLobbyMusic(c.screen);
  campaignUI.dataset.screen=c.screen;
  const key=JSON.stringify([c.screen,c.day,c.wallet,c.stars,c.upgrades,c.equipped,c.can_resume,c.result,introFrame,shopItem,musicMuted]);
  if(key===campaignViewKey)return;
  campaignViewKey=key;
  const bg = name => {campaignUI.style.backgroundImage=`url('/art/${name}')`;};
  let html='';
  if(c.screen==='title'){
    bg('24-title-screen.png');
    html=`<div class="campaign-panel"><h1>Quán Ăn Chợ Nổi</h1><p>Giữ quán sáng đèn cùng Út Sen</p><div class="campaign-actions">${c.can_resume?'<button data-campaign="resume">Tiếp tục lượt chơi</button>':''}<button data-campaign="start">Bắt đầu · xem intro</button><button data-campaign="replay_intro">Xem lại intro</button><button data-campaign="music">${musicMuted?'Bật nhạc':'Tắt nhạc'}</button></div></div>`;
  } else if(c.screen==='intro'){
    bg(introImages[introFrame]);
    html='<div class="campaign-panel"><div class="campaign-actions"><button data-campaign="music">'+(musicMuted?'🔊 Bật nhạc intro':'🔊 Nhạc intro · Tắt')+'</button><button data-campaign="next_intro">'+(introFrame<3?'Tiếp tục':'Bắt đầu hành trình')+'</button><button data-campaign="skip_intro">Bỏ qua</button></div></div>';
  } else if(c.screen==='equipment'){
    bg('16-upgrade-shop.png');
    const icons={oxygen:'🫧',helmet:'🤿',fins:'🦶',lamp:'🔦',hp:'❤️'};
    const stats=level=>Object.entries(level).filter(([key])=>!['level','price'].includes(key)).map(([key,value])=>({oxygen_max_s:`Oxy ${value}s`,max_depth:`Lặn sâu ${value}m`,swim_speed_multiplier:`Tốc độ ×${value}`,reveal_radius:`Đèn ${value}m`,hp_max:`${value} máu`}[key]||value)).join(' · ');
    const cards=Object.entries(c.upgrade_catalog).map(([id,item])=>`<div style="background:#142c2d;padding:12px;border-radius:12px"><strong>${icons[id]} ${item.label}</strong><p><button data-campaign="equip" data-item="${id}" data-level="-1">${c.equipped[id]===-1?"✓ ":""}Tháo ra</button>${item.levels.map((level,i)=>`<button style="margin:4px;border-width:${c.equipped[id]===i?'3':'1'}px;background:${c.equipped[id]===i?'#447646':'#263c42'}" data-campaign="equip" data-item="${id}" data-level="${i}" ${i>c.upgrades[id]?'disabled':''}>${c.equipped[id]===i?'✓ Đang dùng · ':i>c.upgrades[id]?'🔒 ':''}${i===0?'Cơ bản':'Nâng cấp '+i}<br><small>${stats(level)}${i>c.upgrades[id]?' · '+level.price+' xu':''}</small></button>`).join(' ')}</p></div>`).join('');
    html=`<div class="campaign-panel"><h2>Chuẩn bị buổi sáng · Ngày ${c.day}</h2><p>Trang bị cơ bản có sẵn. Mua nâng cấp tại shop rồi chọn để sử dụng.</p><div class="campaign-grid">${cards}</div><div class="campaign-actions"><button data-campaign="shop">🛒 Mua trang bị</button><button data-campaign="music">${musicMuted?'Bật nhạc':'Tắt nhạc'}</button><button data-campaign="begin_morning">☀ Trang bị xong · xuống sông</button></div></div>`;
  } else if(c.screen==='map'){
    bg('25-level-select.png');
    const cards=Array.from({length:c.day_count},(_,i)=>{const n=i+1,open=n===1||(c.stars[String(n-1)]||0)>0,star=c.stars[String(n)]||0;return `<button data-campaign="day" data-day="${n}" ${open?'':'disabled'}>Màn ${n} · ${open?'☆'.repeat(3-star)+'★'.repeat(star):'🔒'}</button>`}).join('');
    html=`<div class="campaign-panel"><h2>Chọn màn</h2><p>Ví: ${c.wallet} xu · Uy tín: ${Number(c.reputation).toFixed(1)}</p><div class="campaign-grid">${cards}</div><div class="campaign-actions"><button data-campaign="shop">Cửa hàng</button><button data-campaign="replay_intro">Xem lại intro</button><button data-campaign="title">Về sảnh</button><button data-campaign="music">${musicMuted?'Bật nhạc':'Tắt nhạc'}</button></div></div>`;
  } else if(c.screen==='results'){
    bg('27-level-results.png');
    const r=c.result||{};
    html=`<div class="campaign-panel"><h2>Màn ${c.day} · ${'★'.repeat(r.stars||0)}${'☆'.repeat(3-(r.stars||0))}</h2><p>Phục vụ ${r.fulfilled_count||0} món đúng kế hoạch · Uy tín ${Number(r.reputation||0).toFixed(1)}</p><p>Khách trả ${r.earned_from_customers||0} xu · Sự kiện ${r.event_money_delta||0} xu · Thưởng ${r.bonus||0} xu</p><p>Xu thay đổi: <strong>${r.total_earned_this_day||0}</strong> · Ví hiện tại: ${c.wallet} xu</p><div class="campaign-actions"><button data-campaign="shop">Nâng cấp</button><button data-campaign="map">Chọn màn</button><button data-campaign="title">Về sảnh</button></div></div>`;
  } else if(c.screen==='shop'){
    bg(shopItem?'22-upgrade-detail-template.png':'16-upgrade-shop.png');
    if(!shopItem){
      const cards=Object.entries(c.upgrade_catalog).map(([id,item])=>`<button data-campaign="item" data-item="${id}">${item.label} · Cấp ${c.upgrades[id]+1}/3</button>`).join('');
      html=`<div class="campaign-panel"><h2>Cửa hàng · ${c.wallet} xu</h2><div class="campaign-grid">${cards}</div><div class="campaign-actions"><button data-campaign="map">Chọn màn</button><button data-campaign="title">Về sảnh</button></div></div>`;
    } else {
      const item=c.upgrade_catalog[shopItem], level=c.upgrades[shopItem];
      const rows=item.levels.map((l,i)=>{const state=i<=level?'Đã có':i===level+1?(c.wallet>=l.price?'Mua '+l.price+' xu':'Thiếu '+(l.price-c.wallet)+' xu'):'Mở sau cấp '+i;return `<button data-campaign="buy" data-item="${shopItem}" ${i===level+1&&c.wallet>=l.price?'':'disabled'}>Cấp ${i+1} · ${Object.entries(l).filter(([k])=>!['level','price'].includes(k)).map(([,v])=>v).join(' · ')} · ${state}</button>`}).join('');
      html=`<div class="campaign-panel"><h2>${item.label} · ${c.wallet} xu</h2><div class="campaign-grid">${rows}</div><div class="campaign-actions"><button data-campaign="back_shop">Quay lại</button><button data-campaign="map">Chọn màn</button><button data-campaign="title">Về sảnh</button></div></div>`;
    }
  }
  campaignUI.innerHTML=html;
  if(c.screen==='shop') {
    const actions=campaignUI.querySelector('.campaign-actions');
    actions?.insertAdjacentHTML('beforeend','<button data-campaign="prepare">Chuẩn bị ngày tiếp theo →</button>');
  }
}
campaignUI.addEventListener('click',async e=>{
  const b=e.target.closest('[data-campaign]');if(!b)return;
  const action=b.dataset.campaign;
  if(action==='music'){musicMuted=lobbyMusic.paused?false:!musicMuted; if(musicMuted)lobbyMusic.pause();else {musicAttempted=true;playIntroMusic();}campaignViewKey='';renderCampaignUI();}
  else if(action==='start'){introFrame=0;await campaignAction('start');}
  else if(action==='replay_intro'){introFrame=0;await campaignAction('replay_intro');}
  else if(action==='next_intro'){if(introFrame<3){introFrame++;campaignViewKey='';renderCampaignUI();}else await campaignAction('intro_done');}
  else if(action==='skip_intro'){introFrame=0;await campaignAction('intro_done');}
  else if(action==='back_shop'){shopItem=null;campaignViewKey='';renderCampaignUI();}
  else if(action==='item'){shopItem=b.dataset.item;campaignViewKey='';renderCampaignUI();}
  else if(action==='day'){shopItem=null;await campaignAction('select_day',{day:Number(b.dataset.day)});}
  else if(action==='buy') await campaignAction('buy',{item:b.dataset.item});
  else if(action==='equip') {
    const level=Number(b.dataset.level),item=b.dataset.item;
    const chosen=snap.campaign.equipped[item]===level && level>=0?-1:level;
    b.disabled=true;
    if(await campaignAction('equip',{item,level:chosen})){
      const response=await fetch('/state',{cache:'no-store'});
      snap=await response.json();campaignViewKey='';renderCampaignUI();
    } else b.disabled=false;
  }
  else {if(action==='shop')shopItem=null;if(action==='title'){introFrame=0;shopItem=null;}await campaignAction(action);}
});
campaignHome.addEventListener('click',async()=>{
  if(transitioning)return;
  down.clear();queue.length=0;lastSent='';resetQuanActors();
  await campaignAction('title');
});
// Hoạt ảnh khách đi vào từ cầu gỗ và rời quán (chỉ hiển thị client, không ảnh hưởng sim/headless)
const customerWalkIn = new Map();
const leavingCustomers = [];
let prevQuanCustomers = new Map();
let lastQuanTick = -1, quanSeenOnce = false;
function resetQuanActors() {
  customerWalkIn.clear();
  leavingCustomers.length = 0;
  prevQuanCustomers.clear();
  lastQuanTick = -1;
  quanSeenOnce = false;
}
function samplePath(pts, t) {
  const clamped = Math.max(0, Math.min(1, t));
  let total = 0;
  const segs = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
    segs.push([pts[i], pts[i + 1], len]);
    total += len;
  }
  if (!total) return { pos: pts[pts.length - 1], dx: 0 };
  let target = clamped * total;
  for (const [a, b, len] of segs) {
    if (target <= len || len === 0) {
      const f = len ? target / len : 1;
      return { pos: [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f], dx: b[0] - a[0] };
    }
    target -= len;
  }
  const last = segs[segs.length - 1];
  return { pos: pts[pts.length - 1], dx: last ? last[1][0] - last[0][0] : 0 };
}
function walkPathToSeat(seatX, seatZ, isPainted) {
  const gate = [7.75, 0.35], deck = [7.75, 2.5];
  if (isPainted) return [gate, deck, [10.8, Math.max(3.2, seatZ - 0.6)], [seatX, seatZ]];
  return [gate, deck, [seatX, seatZ]];
}
let audioContext = null, soundEnabled = false, lastSoundEvent = '';
let chaseSource = null, chaseBuffer = null, chaseLoading = null, audioTouched = false;
let jackSource = null, jackBuffer = null, jackLoading = null;
function loadChaseMusic() {
  if (!chaseLoading) chaseLoading = fetch('/art/chieu-troi-mua.mp3')
    .then(response => { if (!response.ok) throw new Error('Không tải được nhạc'); return response.arrayBuffer(); })
    .then(data => audioContext.decodeAudioData(data))
    .then(buffer => { chaseBuffer = buffer; })
    .catch(() => { chaseLoading = null; soundButton.title = 'Không tải được bài nhạc; hãy khởi động lại server'; });
  return chaseLoading;
}
function loadJackMusic() {
  if (!jackLoading) jackLoading = fetch('/art/thien-ly-oi.mp3')
    .then(response => { if (!response.ok) throw new Error('Không tải được nhạc'); return response.arrayBuffer(); })
    .then(data => audioContext.decodeAudioData(data))
    .then(buffer => { jackBuffer = buffer; })
    .catch(() => { jackLoading = null; });
  return jackLoading;
}
let musicKey = '', musicTimer = null, musicVoices = [], musicStep = 0;
const weatherTunes = {
  sun: [60,64,67,72,67,64,62,67],
  rain: [48,55,51,55,50,57,53,57],
  snow: [84,79,81,76,79,74,76,72],
  fog: [48,49,55,0,51,50,55,0],
  wind: [72,60,74,62,76,64,71,59],
  bubbles: [72,79,84,79,74,81,86,81],
  fish_rain: [60,67,72,60,62,69,74,62],
  rainbow: [60,62,64,67,69,72,76,79],
  quan: [60,64,67,69,67,64,62,55]
};
function stopMusic() {
  clearInterval(musicTimer); musicTimer = null;
  musicVoices.forEach(voice => { try { voice.stop(); } catch (_) {} });
  musicVoices = [];
  if (chaseSource) { try { chaseSource.stop(); } catch (_) {} chaseSource.disconnect(); chaseSource = null; }
  if (jackSource) { try { jackSource.stop(); } catch (_) {} jackSource.disconnect(); jackSource = null; }
}
function syncMusic() {
  const key = !soundEnabled || document.hidden || !snap || snap.finished || transitioning || (snap.campaign && snap.campaign.screen!=='playing') ? ''
    : snap.mode === 'gather' && snap.pursuer?.active ? 'chase'
    : snap.mode === 'gather' ? snap.weather
    : snap.mode === 'quan' && snap.jack?.active && snap.jack?.state === 'singing' ? 'jack'
    : 'quan';
  if (key === musicKey) return;
  stopMusic(); musicKey = key; musicStep = 0;
  if (!key || !audioContext) return;
  if (key === 'chase' && chaseBuffer) {
    chaseSource = audioContext.createBufferSource(); chaseSource.buffer = chaseBuffer; chaseSource.loop = true;
    const gain = audioContext.createGain(); gain.gain.value = .65;
    chaseSource.connect(gain); gain.connect(audioContext.destination);
    chaseSource.onended = () => gain.disconnect(); chaseSource.start();
    return;
  }
  if (key === 'chase') loadChaseMusic().then(() => { if (chaseBuffer && musicKey === 'chase') { musicKey = ''; syncMusic(); } });
  if (key === 'jack' && jackBuffer) {
    jackSource = audioContext.createBufferSource(); jackSource.buffer = jackBuffer; jackSource.loop = true;
    const gain = audioContext.createGain(); gain.gain.value = .75;
    jackSource.connect(gain); gain.connect(audioContext.destination);
    jackSource.onended = () => gain.disconnect(); jackSource.start();
    return;
  }
  if (key === 'jack') loadJackMusic().then(() => { if (jackBuffer && musicKey === 'jack') { musicKey = ''; syncMusic(); } });
  const melody = weatherTunes[key] || weatherTunes.sun;
  const beat = key === 'wind' || key === 'fish_rain' ? 180 : key === 'fog' ? 450 : 280;
  function note() {
    if (!soundEnabled || audioContext.state !== 'running') return;
    const pitch = melody[musicStep++ % melody.length];
    if (!pitch) return;
    const now = audioContext.currentTime, osc = audioContext.createOscillator(), gain = audioContext.createGain();
    osc.type = key === 'wind' || key === 'fish_rain' ? 'triangle' : 'sine';
    osc.frequency.value = 440 * 2 ** ((pitch-69)/12);

const riverSplashes = [];

function syncRiverVfx() {
  if (!snap || snap.mode !== 'gather') return;
  if (snap.tick < lastGatherTick) {
    riverSplashes.length = 0;
    riverPopups.length = 0;
    lastGatherVfxKey = '';
  }
  lastGatherTick = snap.tick;
  const pPos = snap.player?.pos || [2, 0];
  for (const e of snap.events || []) {
    const key = `${String(e.tick).padStart(8, '0')}:${e.name}:${e.data?.fish_id || e.data?.node_id || e.data?.id || e.data?.item_id || ''}`;
    if (key <= lastGatherVfxKey) continue;
    lastGatherVfxKey = key;
    if (e.name === 'dive' || e.name === 'surface') {
      const pos = e.data?.pos || pPos;
      for (let i = 0; i < 10; i++) {
        const ang = -Math.PI * (0.15 + 0.7 * (i / 9));
        const spd = 1.4 + (i % 3) * 0.7;
        riverSplashes.push({
          x: pos[0], d: 0, vx: Math.cos(ang) * spd * 0.14, vd: Math.sin(ang) * spd * 0.14,
          born: snap.tick, life: 28 + (i % 4) * 6, r: 2.5 + (i % 3),
        });
      }
    } else if (e.name === 'fish_caught') {
      const cnt = e.data?.yield || e.data?.count || 1;
      riverPopups.push({ x: pPos[0], d: pPos[1] - 0.8, text: `+${cnt} ${itemName(e.data?.kind || '')}`, color: '#7dd3fc', born: snap.tick, life: 72 });
    } else if (e.name === 'gather') {
      const cnt = e.data?.amount || e.data?.count || 1;
      riverPopups.push({ x: pPos[0], d: -1.0, text: `+${cnt} ${itemName(e.data?.kind || '')}`, color: '#bef264', born: snap.tick, life: 72 });
    } else if (e.name === 'treasure_picked') {
      riverPopups.push({ x: pPos[0], d: pPos[1] - 1.0, text: `✨ ${e.data?.label || 'Kho báu'}`, color: '#fde047', born: snap.tick, life: 90 });
    } else if (e.name === 'bubble_collected') {
      riverPopups.push({ x: pPos[0], d: pPos[1] - 0.8, text: '+O₂', color: '#67e8f9', born: snap.tick, life: 54 });
    } else if (e.name === 'hold_full') {
      riverPopups.push({ x: pPos[0], d: pPos[1] - 1.0, text: 'Giỏ đầy!', color: '#fb923c', born: snap.tick, life: 66 });
    } else if (e.name === 'hazard_hit' || e.name === 'pursuer_hit' || e.name === 'choke') {
      riverPopups.push({ x: pPos[0], d: pPos[1] - 1.0, text: '-1 ♥', color: '#fb7185', born: snap.tick, life: 72 });
    } else if (e.name === 'spoiled') {
      riverPopups.push({ x: pPos[0], d: Math.max(-1.2, pPos[1] - 1.4), text: `⚠ ${itemName(e.data?.kind || '')} bị ươn!`, color: '#fca5a5', born: snap.tick, life: 84 });
    }
  }
  for (let i = riverSplashes.length - 1; i >= 0; i--) {
    const sp = riverSplashes[i];

function drawGather(w, h) {
  syncRiverVfx();
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 110, bottom = 75;
  const viewWidth = Math.min(100, X);
  const viewLeft = Math.max(0,Math.min(X-viewWidth,(snap.player?.pos[0]||0)-viewWidth/2));
  const s = Math.max(1, Math.min((w - 20) / (viewWidth + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * viewWidth) / 2, oy = top + SKY * s;
  const sx = (x) => ox + (x-viewLeft) * s, sy = (d) => oy + d * s;
  const tNow = snap.tick / 60;
  ctx.save();ctx.beginPath();ctx.rect(ox,top,viewWidth*s,(D+SKY)*s);ctx.clip();
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  if (riverArt.complete && riverArt.naturalWidth) {
    // The painted waterline is at 34% of this background: map it to depth zero.
    const split = riverArt.naturalHeight * 0.34;
    ctx.drawImage(riverArt, 0, 0, riverArt.naturalWidth, split, ox, top, viewWidth*s, oy-top);
    ctx.drawImage(riverArt, 0, split, riverArt.naturalWidth, riverArt.naturalHeight-split,
                  ox, oy, viewWidth*s, D*s);
  }
  if (highContrast) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.56)';
    ctx.fillRect(ox, top, viewWidth * s, (D + SKY) * s);
  }
  // tia nắng xuyên nước (tự dịu/ẩn khi mưa, tuyết hoặc sương mù)
  if (!['rain', 'fog', 'snow'].includes(snap.weather)) {
    const rayAlpha = snap.weather === 'sun' || snap.weather === 'rainbow' ? 0.16 : 0.1;
    ctx.save();
    for (let i = 0; i < 6; i++) {
      const rx = ox + ((i + 0.45) / 6) * viewWidth * s + Math.sin(tNow * 0.65 + i * 1.4) * 18;
      const rw = (36 + (i % 3) * 18);
      const rLen = D * s * (0.55 + (i % 2) * 0.22);
      const rg = ctx.createLinearGradient(rx, oy, rx + 55, oy + rLen);
      rg.addColorStop(0, `rgba(255, 248, 200, ${rayAlpha})`);
      rg.addColorStop(0.55, `rgba(180, 240, 255, ${rayAlpha * 0.45})`);
      rg.addColorStop(1, 'rgba(180, 240, 255, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(rx - rw * 0.35, oy);
      ctx.lineTo(rx + rw * 0.45, oy);
      ctx.lineTo(rx + rw * 1.25 + 48, oy + rLen);
      ctx.lineTo(rx - rw * 0.15 + 32, oy + rLen);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
  // hạt phù sa lấp lánh & bong bóng li ti từ đáy sông
  ctx.save();

  // Cảnh báo 1 (Oxy sắp hết) & Cảnh báo 2 (Thủy quái / nguy hiểm gần) — có biểu tượng + chữ rõ ràng, tương thích Tương phản cao
  const lowOxygen = p && p.oxygen_max_ticks && p.oxygen_ticks <= p.oxygen_max_ticks * 0.25 && !p.at_surface;
  if (lowOxygen) {
    const blink = Math.floor(snap.tick / 8) % 2;
    const pulse = 0.12 + blink * 0.08;
    ctx.fillStyle = highContrast ? `rgba(255, 234, 0, ${0.14 + blink * 0.12})` : `rgba(190, 18, 28, ${pulse})`;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = highContrast ? (blink ? '#ffea00' : '#ffffff') : `rgba(255, 62, 72, ${0.45 + pulse})`;
    ctx.lineWidth = highContrast ? 10 : 8;
    ctx.strokeRect(5, 5, w - 10, h - 10);
    alertBanner('🫧 ⚠️ SẮP HẾT OXY! NỔI LÊN NGAY!', w, 98, {
      width: 480, height: 38, size: 17,
      bg: 'rgba(165, 16, 24, 0.95)', border: '#ffea00', color: '#fff5f5',
    });
  }
  let nearestThreat = null;
  if (p && p.pos) {
    const checkThreat = (pos, label, limit, chasing = false) => {
      if (!pos) return;
      const dx = pos[0] - p.pos[0], dd = pos[1] - p.pos[1];
      const dist = Math.hypot(dx, dd);
      if (chasing || dist <= limit) {
        if (!nearestThreat || dist < nearestThreat.dist) {
          const dir = Math.abs(dx) >= Math.abs(dd) ? (dx >= 0 ? 'bên phải →' : '← bên trái') : (dd >= 0 ? 'phía dưới ↓' : '↑ phía trên');
          nearestThreat = { label, dist, dir, chasing };
        }
      }
    };
    (snap.monsters || []).forEach(m => checkThreat(m.pos, 'Thủy quái', 16, m.state === 'chase'));
    if (snap.pursuer?.active && !(snap.pursuer.hug_ticks_left > 0)) {
      checkThreat(snap.pursuer.pos, snap.pursuer.label || 'Chú Áo Vàng', 22, true);
    }
    (snap.hazards || []).forEach(hz => {
      if (!p.at_surface) checkThreat(hz.pos, hz.kind === 'jellyfish' ? 'Sứa điện' : 'Cá độc', 7.5, false);
    });
  }
  if (nearestThreat) {
    const warnY = lowOxygen ? 144 : 98;
    alertBanner(
      `⚠️ THỦY QUÁI GẦN: ${nearestThreat.label} (${nearestThreat.dir} · ${nearestThreat.dist.toFixed(1)}m) — TRÁNH NGAY!`,
      w, warnY,
      { width: 620, height: 36, size: 14.5, bg: 'rgba(138, 36, 12, 0.95)', border: '#fde047', color: '#fff7d6' }
    );
  }
  if (snap.pursuer?.hug_ticks_left > 0) {
    ctx.fillStyle = 'rgba(30,12,8,.88)'; ctx.fillRect(w/2-270,h/2-45,540,90);
    text('CHÚ ÁO VÀNG ĐÃ BẮT VÀ ÔM BẠN!',w/2,h/2,{size:22,align:'center',color:'#ffe778'});
    text('Mất 1 máu · bơi lên mặt nước để thoát',w/2,h/2+28,{size:16,align:'center'});
  }
  if(snap.poison_ticks>0){
    ctx.strokeStyle='rgba(180,90,255,.75)';ctx.lineWidth=12;ctx.strokeRect(6,6,w-12,h-12);
    text('☠ TRÚNG ĐỘC! Oxy hao nhanh · '+Math.ceil(snap.poison_ticks/60)+'s',w/2,175,{size:19,align:'center',color:'#efb3ff'});
  }
  // HUD trên
  if(snap.campaign){
    const gear=`🤿 ${meta.max_depth||20}m · 🔦 ${meta.reveal_radius||3}m · 🦶 ${Number(meta.swim_speed||0).toFixed(1)}m/s · 🫧 ${Math.round((p.oxygen_max_ticks||0)/60)}s · ❤️ ${p.hp_max}`;
    text(gear,w/2,h-110,{size:15,align:'center',color:'#aff7ce'});
  }
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  if (snap.collection) text('Bộ sưu tập dưới nước: ' + snap.collection.length + '/' + snap.collection_capacity,
                            345, 52, {size:13,align:'left',color:'#ffe3a3'});
  text((weatherText[snap.weather]||'')+' · '+Math.ceil((snap.weather_ticks_left||0)/60)+'s',14,78,{size:13,color:'#ffe1a2'});
  ctx.fillStyle='rgba(12,22,40,.82)';ctx.fillRect(w/2-Math.min(720,w-24)/2,h-175,Math.min(720,w-24),38);
  text(weatherText[snap.weather]||'',w/2,h-150,{size:Math.min(19,w/48),align:'center',color:'#ffedb5'});
  if(snap.weather_ticks_left<=180) text('Sắp đổi trời: '+(weatherText[snap.next_weather]||''),w/2,145,{size:16,align:'center',color:'#fff1bc'});
  text('Sông '+X+' m · '+(viewLeft<60?'Bến Sen':viewLeft<120?'Vùng Cồn Cá':'Khúc Sông Cổ'),14,99,{size:12,color:'#c5d4d8'});
  if(snap.pursuer?.hug_ticks_left>0){ctx.fillStyle='rgba(80,20,18,.82)';ctx.fillRect(w/2-Math.min(w-20,450)/2,top+5,Math.min(w-20,450),28);
    text('BỊ ÔM! Chờ Chú Áo Vàng buông ra',w/2,top+24,{size:13,align:'center',color:'#ffe778'});}
  else if(snap.pursuer?.active){ctx.fillStyle='rgba(15,31,35,.75)';ctx.fillRect(w/2-Math.min(w-20,450)/2,top+5,Math.min(w-20,450),28);
    text('CHẠY! Chú Áo Vàng đang đuổi · chạm mất 1 HP',w/2,top+24,{size:13,align:'center',color:'#ffcf71'});}
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    const stacks = [], byKind = new Map();
    snap.hold.forEach((kind) => {
      if (!byKind.has(kind)) { const stack = { kind, count: 0 }; byKind.set(kind, stack); stacks.push(stack); }
      byKind.get(kind).count++;
    });
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const stack = stacks[i];
      if (stack) {
        if (!itemSprite(stack.kind,x0+sz/2,y0+sz/2,sz-2)) {
          ctx.fillStyle = kc(stack.kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        }
        const fresh = (snap.fresh_items||[]).filter(item=>item.kind===stack.kind);
        if(fresh.length){const value=Math.min(...fresh.map(item=>item.fresh));ctx.fillStyle=value<30?'#d45665':value<60?'#ffc45c':'#7fe6a3';ctx.fillRect(x0,y0-5,sz*value/100,3);text(Math.floor(value)+'%',x0+sz/2,y0-9,{size:10,align:'center',color:ctx.fillStyle});}
        const badge = `x${stack.count}`, bw = Math.max(18, badge.length * 7 + 6);
        ctx.fillStyle = 'rgba(18,25,29,.9)'; ctx.fillRect(x0 + sz - bw + 2, y0 + sz - 12, bw, 12);
        text(badge,x0+sz-1,y0+sz-2,{size:9,align:'right',color:'#fff4c8'});
      }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => itemName(k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("S ↓ lặn · W ↑ nổi · A/D bơi · E nhặt/hái/cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function pill(s, x, y, o = {}) {
  const sz = o.size || 11;
  ctx.font = `600 ${sz}px system-ui, sans-serif`;
  const padX = 7, h = sz + 7;
  const w = ctx.measureText(s).width + padX * 2;
  ctx.fillStyle = highContrast ? "#000000" : (o.bg || "rgba(26, 15, 7, 0.78)");
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 6);
  ctx.fill();
  ctx.strokeStyle = highContrast ? (o.hcBorder || "#ffea00") : (o.border || "rgba(240, 200, 128, 0.55)");
  ctx.lineWidth = highContrast ? 2 : 1;
  ctx.stroke();
  text(s, x, y + sz * 0.35, { size: sz, align: "center", color: highContrast ? (o.hcColor || "#ffffff") : (o.color || "#fff5da") });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 108, bottom = 78;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const hasBg = quanArt.complete && quanArt.naturalWidth > 0;
  if (hasBg) {
    ctx.drawImage(quanArt, sx(0), sy(Z), X * s, Z * s);
  } else {
    ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
    for(let z=0;z<Z;z+=.5){ctx.strokeStyle='rgba(80,42,18,.15)';ctx.beginPath();ctx.moveTo(sx(0),sy(z));ctx.lineTo(sx(X),sy(z));ctx.stroke();}
  }
  if (highContrast) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.54)";
    ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  }
  ctx.strokeStyle = highContrast ? "#ffea00" : "#6b4a2b"; ctx.lineWidth = 3; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  pill('QUÁN ÚT SEN · NHÀ BÈ CHỢ NỔI', sx(X / 2), sy(Z) + 18, { size: 13, color: '#ffe8a8' });
  // bếp (khớp 2 bếp lò trong nền ảnh quán)
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const col = st.state === "cooking" ? "#f59e0b" : st.state === "ready" ? "#4ade80" : "#cbd5e1";
    if (!hasBg || !st.painted) {
      const cell = st.state === 'cooking' ? 1 : st.state === 'ready' ? 2 : 0;
      if (!sprite(propsArt, cell, 1, 4, 4, bx, by, 1.8 * s)) {
        ctx.fillStyle = col; ctx.fillRect(bx - 0.8 * s, by - 0.8 * s, 1.6 * s, 1.6 * s);
      }
    } else if (st.state !== 'idle') {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.shadowColor = col;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(bx, by, 0.72 * s + Math.sin(snap.tick / 7) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    const dishId = typeof st.dish === 'string' ? st.dish : st.dish?.dish_id;
    if (st.state === 'ready' && dishId) {
      const cell = dishCell[dishId] ?? 0;
      sprite(dishesArt, cell % 4, Math.floor(cell / 4), 4, 2, bx, by - 0.1 * s, 0.95 * s);
    }
    const statusText = st.state === 'cooking'
      ? `${st.id} · Nấu ${Math.ceil((st.cook_ticks_left || 0) / 60)}s`
      : st.state === 'ready' ? `${st.id} · E lấy món!` : `${st.id} · E nấu`;
    pill(statusText, bx, by + 0.92 * s, {
      size: 11,
      color: st.state === 'ready' ? '#a7f3d0' : st.state === 'cooking' ? '#fde68a' : '#fff5da',
      border: col,
    });
    if (dishId) pill(dishName(dishId), bx, by - 0.95 * s, { size: 10, color: '#ffe7b3' });
  });
  // đồng bộ trạng thái khách đi vào từ cầu gỗ & khách rời quán (chỉ hiệu ứng hiển thị)
  if (snap.tick < lastQuanTick) resetQuanActors();
  lastQuanTick = snap.tick;
  const tableMap = {};
  (snap.tables || []).forEach((tb) => (tableMap[tb.id] = tb));
  const curIds = new Set();
  (snap.customers || []).forEach((c) => {
    curIds.add(c.id);
    const tb = tableMap[c.table_id];
    const isPainted = hasBg && tb?.painted;
    const seatX = tb ? (isPainted ? tb.pos[0] + 1.15 : tb.pos[0]) : 8;
    const seatZ = tb ? (isPainted ? tb.pos[1] + 0.08 : tb.pos[1] + 0.92) : 5;
    if (!customerWalkIn.has(c.id)) {
      const startTick = (!quanSeenOnce && snap.tick > 150) ? snap.tick - 999 : snap.tick;
      customerWalkIn.set(c.id, {
        startTick,
        duration: 95,
        path: walkPathToSeat(seatX, seatZ, isPainted),
      });
    }
    prevQuanCustomers.set(c.id, {
      id: c.id, label: c.label || c.id, sprite: c.sprite || 0,
      seatX, seatZ, isPainted,
    });
  });
  quanSeenOnce = true;
  for (const [id, info] of Array.from(prevQuanCustomers.entries())) {
    if (!curIds.has(id)) {
      const paidEv = (snap.events || []).find(e => e.name === 'paid' && (e.data?.order_id === id || e.data?.customer_id === id));
      const leftEv = (snap.events || []).find(e => e.name === 'customer_left' && (e.data?.order_id === id || e.data?.customer_id === id));
      const revPath = walkPathToSeat(info.seatX, info.seatZ, info.isPainted).slice().reverse();
      leavingCustomers.push({
        ...info,
        startTick: snap.tick,
        duration: 85,
        path: revPath,
        note: paidEv ? `Cảm ơn! +${paidEv.data?.amount ?? ''}k ✦` : leftEv ? 'Chờ lâu quá…' : 'Hẹn gặp lại!',
        happy: Boolean(paidEv),
      });
      prevQuanCustomers.delete(id);
      customerWalkIn.delete(id);
    }
  }
  for (let i = leavingCustomers.length - 1; i >= 0; i--) {
    if (snap.tick - leavingCustomers[i].startTick > leavingCustomers[i].duration + 12) leavingCustomers.splice(i, 1);
  }

  // bàn + khách (T1–T3 nằm đúng 3 bàn gỗ trên ảnh nền, khách ngồi ghế bên phải; T4 vẽ thêm trên sàn gỗ)
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  const resByTable = {};
  (snap.reservations || []).forEach((r) => {
    if (r.state === 'holding' || r.state === 'waiting') resByTable[r.table_id] = r;
  });
  const handCustId = snap.hand ? (snap.hand.customer_id || snap.hand.order_id || null) : null;
  const walkingInDraw = [];
  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const isPainted = hasBg && tb.painted;
    if (!isPainted) {
      sprite(propsArt, 0, 2, 4, 4, tx, ty, 2.2 * s);
    }
    const c = byTable[tb.id];
    const heldRes = resByTable[tb.id];
    if (c) {
      const isHandTarget = Boolean(handCustId && c.id === handCustId);
      if (isHandTarget) {
        ctx.save();
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(tx, ty, 0.92 * s + Math.sin(snap.tick / 6) * 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      const anim = customerWalkIn.get(c.id);
      const progress = anim ? Math.min(1, (snap.tick - anim.startTick) / anim.duration) : 1;
      if (progress < 1) {
        // Khách đang đi từ cầu gỗ vào bàn: hiện nhãn bàn đang giữ chỗ + vẽ nhân vật đi bộ ở lớp trên
        pill(`${tb.label || tb.id} · Khách đang tới`, isPainted ? tx - 0.25 * s : tx, ty + 0.62 * s, { size: 9.5, color: '#fde68a' });
        walkingInDraw.push({ c, anim, progress });
        return;
      }
      // Đã ngồi vào ghế: dùng sprite NGỒI (16-seated-waiting.png khi chờ, 13-dining-cast.png khi ăn/uống)
      const cx = isPainted ? tx + 1.15 * s : tx;
      const cy = isPainted ? ty - 0.08 * s : ty - 0.92 * s;
      const flip = isPainted;
      const drinking = c.state === 'eating' && c.eat_ticks_left < (meta.eat_s || 10) * 30;
      const served = (snap.events || []).some(e => e.name === 'served' && (e.data?.order_id === c.id || e.data?.customer_id === c.id) && snap.tick - e.tick < 90);
      const eating = c.state === 'eating';
      const waitingKitchen = c.order_status === 'assigned' || c.state === 'assigned';
      const isUnfulfillable = c.order_status === 'unfulfillable';
      const isVip = Boolean(c.reservation_id);
      const bob = eating ? Math.sin(snap.tick / 7) * 2.2 : served ? Math.sin(snap.tick / 3) * 3.5 : Math.sin(snap.tick / 20) * 1.0;
      const bite = eating && !drinking && Math.floor(snap.tick / 18) % 2 === 0;
      const seatSize = 1.48 * s;
      if (eating) {
        sprite(diningArt, c.sprite || 0, drinking ? 1 : 0, 4, 2, cx, cy + bob, seatSize, flip, bite ? -.03 : .015);
      } else {
        const waitRow = waitingKitchen ? 1 : 0;
        if (!sprite(seatedArt, c.sprite || 0, waitRow, 4, 2, cx, cy + bob, seatSize, flip, served ? -.03 : 0)) {
          sprite(diningArt, c.sprite || 0, 0, 4, 2, cx, cy + bob, seatSize, flip, 0);
        }
      }
      if (served) { ctx.fillStyle = '#ffd45c'; ctx.font = `${Math.max(12, Math.min(20, s * .55))}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('✦', cx, cy - s * .72 + bob); }
      const cState = c.state === 'eating' ? (drinking ? 'Uống ' + (c.drink || 'trà') : 'Đang ăn')
        : waitingKitchen ? 'Chờ bếp' : isUnfulfillable ? '⚠ Thiếu hàng tươi' : 'Gọi món';
      const labelX = isPainted ? tx - 0.25 * s : tx;
      pill(`${isVip ? '★ ' : ''}${c.label || c.id} · ${cState}`, labelX, ty - 0.56 * s, {
        size: 10,
        color: isUnfulfillable ? '#fecaca' : (isVip ? '#fef08a' : '#fff4d4'),
        border: isUnfulfillable ? '#ef4444' : (isVip ? '#facc15' : undefined),
      });
      if (isHandTarget) {
        pill('✨ E · Phục vụ!', labelX, ty - 0.96 * s, { size: 10.5, color: '#fef08a', border: '#facc15', bg: 'rgba(120, 62, 10, 0.92)' });
      }
      if (eating) {
        const cell = drinking ? 7 : (dishCell[c.dish_id] ?? 0);
        sprite(dishesArt, cell % 4, Math.floor(cell / 4), 4, 2, tx - 0.1 * s, ty - 0.05 * s, 0.88 * s);
      } else if (c.patience_ticks_left !== undefined) {
        const frac = c.patience_ticks_left / patMax;
        bar(labelX - 0.75 * s, ty + 0.34 * s, 1.5 * s, highContrast ? 7 : 5, frac, frac < 0.25 ? '#ef4444' : frac < 0.5 ? '#f59e0b' : '#4ade80');
        if (frac <= 0.35) {
          const blink = Math.floor(snap.tick / 10) % 2 === 0;
          ctx.save();
          ctx.strokeStyle = highContrast ? (blink ? '#ffea00' : '#ffffff') : (blink ? '#ef4444' : '#fde047');
          ctx.lineWidth = highContrast ? 4 : 3;
          ctx.beginPath();
          ctx.arc(tx, ty, 0.88 * s + Math.sin(snap.tick / 5) * 3, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          pill(`💢 Sắp giận! ${Math.ceil(c.patience_ticks_left / 60)}s`, labelX, ty - (isHandTarget ? 1.32 : 0.96) * s, {
            size: 10.5,
            color: '#fff5f5',
            hcColor: '#ffea00',
            border: '#ef4444',
            hcBorder: '#ffea00',
            bg: 'rgba(153, 27, 27, 0.94)',
          });
        }
      }
      pill((isVip ? '×1.5 · ' : '') + dishName(c.dish_id), labelX, ty + 0.62 * s, {
        size: 9.5,
        color: isVip ? '#fde68a' : '#ffe5a3',
        border: isVip ? '#eab308' : undefined,
      });
    } else if (heldRes && heldRes.state === 'holding') {
      const remS = Math.max(0, Math.ceil((heldRes.arrival_tick - (snap.elapsed || 0)) / 60));
      ctx.save();
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(tx, ty, 0.82 * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      pill(`🔒 Giữ bàn ${heldRes.id} · ${remS}s`, tx, ty - 0.45 * s, { size: 10, color: '#fde68a', border: '#f59e0b' });
      pill(`★ ${dishName(heldRes.dish_id)}`, tx, ty + 0.62 * s, { size: 9.5, color: '#fef08a', border: '#eab308' });
    } else {
      pill(tb.label || tb.id, tx, ty + 0.62 * s, { size: 10, color: '#f1e3c6' });
    }
  });
  // khách đang đi từ cầu gỗ vào quán (dùng sprite đi bộ đứng ở propsArt hàng 3 + bóng chân + nhịp bước)
  walkingInDraw.forEach(({ c, anim, progress }) => {
    const { pos, dx } = samplePath(anim.path, progress);
    const wx = sx(pos[0]), wy = sy(pos[1]);
    const stepBounce = Math.abs(Math.sin(snap.tick * 0.24)) * 5;
    const sway = Math.sin(snap.tick * 0.24) * 0.06;
    const fadeIn = Math.min(1, progress * 5);
    ctx.save();
    ctx.globalAlpha = fadeIn;
    ctx.fillStyle = "rgba(25, 12, 4, 0.28)";
    ctx.beginPath(); ctx.ellipse(wx, wy + 0.45 * s, 0.45 * s, 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();
    sprite(propsArt, c.sprite || 0, 3, 4, 4, wx, wy - 0.12 * s - stepBounce, 1.52 * s, dx < -0.05, sway);
    pill(`${c.label || c.id} · Đang vào quán`, wx, wy - 1.05 * s - stepBounce, { size: 10, color: '#fef08a', border: '#eab308' });
    ctx.restore();
  });
  // khách ăn xong / rời bàn đi ngược ra cầu gỗ
  leavingCustomers.forEach((lc) => {
    const p = Math.min(1, (snap.tick - lc.startTick) / lc.duration);
    const { pos, dx } = samplePath(lc.path, p);
    const wx = sx(pos[0]), wy = sy(pos[1]);
    const stepBounce = Math.abs(Math.sin(snap.tick * 0.24)) * 5;
    const sway = Math.sin(snap.tick * 0.24) * 0.06;
    const alpha = p > 0.8 ? Math.max(0, (1 - p) * 5) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(25, 12, 4, 0.25)";
    ctx.beginPath(); ctx.ellipse(wx, wy + 0.45 * s, 0.42 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();
    sprite(propsArt, lc.sprite || 0, 3, 4, 4, wx, wy - 0.12 * s - stepBounce, 1.48 * s, dx < -0.05, sway);
    pill(lc.note, wx, wy - 1.05 * s - stepBounce, {
      size: 10,
      color: lc.happy ? '#bbf7d0' : '#fecaca',
      border: lc.happy ? '#4ade80' : '#ef4444',
    });
    ctx.restore();
  });

  // Khá Bảnh (đi vào, thu bảo kê xong rời quán, hoặc bị công an bắt)
  if (snap.kha_banh && snap.kha_banh.active) {
    const kb = snap.kha_banh;
    const kx = sx(kb.pos[0]), ky = sy(kb.pos[1]);
    const arrested = kb.state === 'arrested';
    const action = kb.action_ticks > 0;
    const leaving = kb.state === 'leaving';
    const row = (arrested || action) ? 1 : 0;
    const col = arrested ? 2 : (action ? (Math.floor(snap.tick / 6) % 4) : (Math.floor(snap.tick / 8) % 4));
    const bob = action ? Math.sin(snap.tick / 3) * 5 : Math.sin(snap.tick / 8) * 2;
    sprite(khaBanhArt, col, row, 4, 2, kx, ky + bob - 0.45 * s, 1.9 * s, kb.facing_left);
    const tag = arrested ? '🚨 BẢNH BỊ BẮT!' : (action ? '💸 ĐÃ THU BẢO KÊ (rời quán)' : (leaving ? 'Khá Bảnh (rời quán)' : 'Khá Bảnh'));
    const color = arrested ? '#ff1744' : (action ? '#ff9100' : '#fbc02d');
    pill(tag, kx, ky - 1.25 * s + bob, { size: (arrested || action) ? 12 : 10.5, color, border: color });
    if (action) {
      ctx.fillStyle = '#ffeb3b';
      ctx.font = `${Math.max(12, Math.min(18, s * 0.65))}px system-ui`;
      ctx.textAlign = 'center';
      const sparkX = kx + Math.sin(snap.tick / 4) * s * 0.7;
      const sparkY = ky - s * 0.5 + Math.cos(snap.tick / 4) * s * 0.4;
      ctx.fillText('💸 -50k', sparkX, sparkY);
    }
  }

  // Chú Công An tuần tra & bảo vệ quán
  if (snap.cong_an && snap.cong_an.active) {
    const ca = snap.cong_an;
    const cx = sx(ca.pos[0]), cy = sy(ca.pos[1]);
    const chasing = ca.state === 'chasing';
    const escorting = ca.state === 'escorting';
    const row = (chasing || escorting) ? 1 : 0;
    const col = chasing ? 3 : (escorting ? 2 : (Math.floor(snap.tick / 8) % 4));
    const bob = chasing ? Math.sin(snap.tick / 2) * 5 : Math.sin(snap.tick / 8) * 2;
    sprite(congAnArt, col, row, 4, 2, cx, cy + bob - 0.45 * s, 1.9 * s, ca.facing_left);
    const caTag = chasing ? '🚨 ĐANG BẮT KHÁ BẢNH!' : (escorting ? '👮‍♂️ DẪN GIẢI VỀ ĐỒN' : '👮‍♂️ Chú Công An (E báo tin)');
    const caColor = chasing ? '#ff1744' : (escorting ? '#00e676' : '#69f0ae');
    pill(caTag, cx, cy - 1.25 * s + bob, { size: (chasing || escorting) ? 12 : 10.5, color: caColor, border: caColor });
  }

  // Ca Sĩ Jack (tiến vào sân khấu bên trái, hát Thiên Lý Ơi, tăng tiền tip cho quán)
  if (snap.jack && snap.jack.active) {
    const jk = snap.jack;
    const jx = sx(jk.pos[0]), jy = sy(jk.pos[1]);
    const singing = jk.state === 'singing';
    const leaving = jk.state === 'leaving';
    const row = singing ? 1 : 0;
    const col = singing ? (Math.floor(snap.tick / 8) % 4) : (Math.floor(snap.tick / 8) % 4);
    const bob = singing ? Math.sin(snap.tick / 3) * 3.5 : Math.sin(snap.tick / 8) * 2;
    sprite(jackArt, col, row, 4, 2, jx, jy + bob - 0.45 * s, 1.95 * s, jk.facing_left);
    const jackTag = singing ? '🎤 Jack đang hát "Thiên Lý Ơi" (+Tip)' : (leaving ? 'Ca Sĩ Jack (chào tạm biệt)' : 'Ca Sĩ Jack (bước vào quán)');
    const jackColor = singing ? '#38bdf8' : '#e0e7ff';
    pill(jackTag, jx, jy - 1.25 * s + bob, { size: singing ? 12 : 10.5, color: jackColor, border: jackColor });
    if (singing) {
      // Nốt nhạc bay bổng quanh Jack
      const notes = ['🎵', '🎶', '✨', '⭐'];
      for (let i = 0; i < 3; i++) {
        const angle = (snap.tick * 0.05 + i * 2.1);
        const radius = (0.7 + 0.3 * Math.sin(snap.tick * 0.08 + i)) * s;
        const nx = jx + Math.cos(angle) * radius;
        const ny = jy - 0.7 * s + Math.sin(angle) * (radius * 0.6) - ((snap.tick * 0.6 + i * 20) % (s * 0.8));
        ctx.fillStyle = '#bae6fd';
        ctx.font = `${Math.max(11, Math.min(16, s * 0.55))}px system-ui`;
        ctx.textAlign = 'center';
        ctx.fillText(notes[(Math.floor(snap.tick / 30) + i) % notes.length], nx, ny);
      }
    }
  }

  // Banner thông báo sự kiện đặc biệt & sự kiện kho/đặt trước
  const specialEv = (snap.events || []).slice().reverse().find(e =>
    ['bao_ke_hit', 'police_alerted', 'kha_banh_arrested', 'police_friendly', 'kha_banh_left',
     'jack_arrived', 'jack_sing_start', 'jack_fan_donation', 'jack_left',
     'reservation_arrived', 'reservation_served', 'reservation_failed', 'spoiled', 'dish_burnt'].includes(e.name) && snap.tick - e.tick < 160
  );
  if (specialEv) {
    const isDanger = ['bao_ke_hit', 'police_alerted', 'reservation_failed', 'spoiled', 'dish_burnt'].includes(specialEv.name);
    const isSuccess = ['kha_banh_arrested', 'jack_fan_donation', 'reservation_served'].includes(specialEv.name);
    const isJack = ['jack_arrived', 'jack_sing_start', 'reservation_arrived'].includes(specialEv.name);
    ctx.fillStyle = isDanger ? 'rgba(211, 47, 47, .92)' : (isSuccess ? 'rgba(46, 125, 50, .95)' : (isJack ? 'rgba(2, 132, 199, .95)' : 'rgba(30, 80, 100, .9)'));
    const boxW = Math.min(w - 20, 580);
    ctx.fillRect(w / 2 - boxW / 2, top + 5, boxW, 30);
    let msg = specialEv.data?.quote || specialEv.data?.song || '';
    if (!msg) {
      if (specialEv.name === 'reservation_arrived') msg = `Khách đặt trước ${specialEv.data?.id || ''} đã tới bàn ${specialEv.data?.table_id || ''}!`;
      else if (specialEv.name === 'reservation_served') msg = `Phục vụ thành công đơn đặt trước ${specialEv.data?.id || ''} (×1.5 giá)!`;
      else if (specialEv.name === 'reservation_failed') msg = `Đơn đặt trước ${specialEv.data?.id || ''} thất bại (${specialEv.data?.reason || 'hết hạn'})`;
      else if (specialEv.name === 'spoiled') msg = `Nguyên liệu ${itemName(specialEv.data?.kind || '')} vừa bị ươn trong kho!`;
      else if (specialEv.name === 'dish_burnt') msg = `Món trên bếp ${specialEv.data?.stove_id || ''} đã bị cháy!`;
      else msg = 'Sự kiện quán';
    }
    text((isDanger ? '⚠️ ' : (isSuccess ? '⭐ ' : (isJack ? '🎤 ' : '📢 '))) + msg, w / 2, top + 25, {
      size: 13,
      align: 'center',
      color: highContrast ? '#ffea00' : '#fff'
    });
  }
  // Cảnh báo 3 (Khách sắp giận — patience <= 35%)
  const angryCustomers = (snap.customers || [])
    .filter(c => c.state !== 'eating' && c.patience_ticks_left !== undefined && (c.patience_ticks_left / patMax) <= 0.35)
    .sort((a, b) => a.patience_ticks_left - b.patience_ticks_left);
  if (angryCustomers.length) {
    const urgent = angryCustomers[0];
    const remSec = Math.max(1, Math.ceil(urgent.patience_ticks_left / 60));
    const extra = angryCustomers.length > 1 ? ` (+${angryCustomers.length - 1} bàn khác)` : '';
    alertBanner(
      `💢 KHÁCH SẮP GIẬN: ${urgent.label || urgent.id} (${urgent.table_id}) · còn ${remSec}s!${extra}`,
      w, specialEv ? top + 40 : top + 6,
      { width: 600, height: 34, size: 14, bg: 'rgba(153, 27, 27, 0.95)', border: '#fde047', color: '#fff7ed' }
    );
  }

  // người chơi (phục vụ di chuyển trên sàn gỗ quán, có bóng chân & nhịp bước)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const vel = p.vel || [0, 0];
    const moving = Math.hypot(vel[0], vel[1]) > 0.08;
    const flipP = vel[0] < -0.05;
    const stepBob = moving ? Math.abs(Math.sin(snap.tick * 0.28)) * 5 : Math.sin(snap.tick * 0.08) * 1.2;
    const sway = moving ? Math.sin(snap.tick * 0.28) * 0.055 : 0;
    if (snap.invuln_ticks > 0 && Math.floor(snap.tick / 4) % 2 === 0) {
      ctx.strokeStyle = "rgba(255, 82, 82, .85)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px, py - 0.42 * s, 0.95 * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255, 240, 185, 0.55)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = "rgba(25, 12, 4, 0.26)";
    ctx.beginPath(); ctx.ellipse(px, py + 0.34 * s, 0.44 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();
    sprite(surfaceArt, 0, 0, 4, 3, px, py - .42 * s - stepBob, 1.75 * s, flipP, sway);
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      const cell = dishCell[hand] ?? 0;
      sprite(dishesArt, cell % 4, Math.floor(cell / 4), 4, 2, px + (flipP ? -.55 : .55) * s, py - .48 * s - stepBob, .85 * s);
      pill('Đang bưng: ' + dishName(hand), px, py - 1.45 * s - stepBob, { size: 11, color: '#fef08a', border: '#f59e0b' });
    }
  }
  // HUD trên + thanh nguyên liệu trực quan có độ tươi từng loại ở dải dưới
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0} xu · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  const freshness = snap.fresh_items || [];
  const spoiled = freshness.filter(item => item.fresh < 30).length;
  const stockEntries = Object.entries(snap.stock || {}).filter(([, cnt]) => cnt > 0);
  const totalItems = stockEntries.reduce((acc, [, cnt]) => acc + cnt, 0);
  text(
    `Kho: ${totalItems} nguyên liệu (${stockEntries.length} loại)` +
    (freshness.length ? ` · Tươi thấp nhất ${Math.floor(Math.min(...freshness.map(i => i.fresh)))}% · Ươn ${spoiled}` : ''),
    14, 52, { size: 13, color: spoiled ? '#ff9b9b' : '#cfd8dc' }
  );
  text(snap.demo_stock ? 'QUÁN MẪU · kho nguyên liệu có sẵn để thử' : 'QUÁN CỦA BẠN · nguyên liệu mang từ sông', 14, 75, { size: 12, color: '#e4c58f' });
  text('E tại bếp: nấu → lấy món khi chín · E tại đúng bàn phát sáng: phục vụ · R chơi lại', 14, 95, { size: 12, color: '#b9d9d6' });

  // Dải thẻ nguyên liệu kèm % tươi từng loại ở cạnh dưới
  if (stockEntries.length) {
    const sz = Math.min(32, Math.max(24, (w - 320) / Math.max(stockEntries.length, 1) - 6));
    const y0 = h - bottom + 22;
    stockEntries.forEach(([kind, cnt], idx) => {
      const x0 = 14 + idx * (sz + 6);
      if (x0 + sz > w - 260) return;
      const byKind = freshness.filter(it => it.kind === kind);
      const minFresh = byKind.length ? Math.min(...byKind.map(it => it.fresh)) : 100;
      const spoiledKind = byKind.filter(it => it.fresh < 30).length;
      ctx.fillStyle = spoiledKind ? 'rgba(127, 29, 29, .55)' : 'rgba(255, 255, 255, .12)';
      ctx.fillRect(x0, y0, sz, sz);
      if (!itemSprite(kind, x0 + sz / 2, y0 + sz / 2, sz - 2)) {
        ctx.fillStyle = kc(kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
      }
      const fCol = minFresh < 30 ? '#ef4444' : minFresh < 60 ? '#fbbf24' : '#4ade80';
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(x0, y0 - 6, sz, 4);
      ctx.fillStyle = fCol; ctx.fillRect(x0, y0 - 6, sz * Math.max(0, Math.min(1, minFresh / 100)), 4);
      text(minFresh < 30 ? 'Ươn' : (Math.floor(minFresh) + '%'), x0 + sz / 2, y0 - 9, { size: 9.5, align: 'center', color: fCol });
      const badge = `×${cnt}`, bw = Math.max(18, badge.length * 6.5 + 5);
      ctx.fillStyle = 'rgba(18,25,29,.9)'; ctx.fillRect(x0 + sz - bw + 2, y0 + sz - 12, bw, 12);
      text(badge, x0 + sz - 1, y0 + sz - 2, { size: 9, align: 'right', color: '#fff4c8' });
    });
  } else if (!(snap.customers || []).length) {
    text('Kho trống: ra sông bắt cá/hái rau, hoặc chọn Quán mẫu', w / 2, h - 38, { size: 14, align: 'center', color: '#ffd181' });
  }
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function drawEveningTransition(w, h) {
  const t = eveningTransition;
  if (!t) return;
  const elapsed = (performance.now() - t.started) / 1000;
  const reveal = t.switched ? Math.min(1, (performance.now() - t.reveal) / 1600) : 0;
  const alpha = Math.min(1, elapsed / .65) * (1 - reveal);
  ctx.save(); ctx.globalAlpha = alpha;
  if (sunsetArt.complete && sunsetArt.naturalWidth) ctx.drawImage(sunsetArt,0,0,w,h);
  else { const sky = ctx.createLinearGradient(0,0,0,h); sky.addColorStop(0,'#17213f'); sky.addColorStop(.6,'#71415b'); sky.addColorStop(1,'#d38b59'); ctx.fillStyle=sky; ctx.fillRect(0,0,w,h); }
  ctx.fillStyle=`rgba(13,18,38,${Math.min(.62,elapsed*.18)})`;ctx.fillRect(0,0,w,h);
  for (let i=0;i<35;i++) { ctx.globalAlpha = alpha*(.35+.35*Math.sin(elapsed*2+i)); ctx.fillRect((i*137+39)%w,(i*67+15)%(h*.42),2,2); }
  ctx.globalAlpha = alpha;
  text('TẠM BIỆT BUỔI SÁNG',w/2,h*.28,{size:18,align:'center',color:'#f2c7a3'});
  text('Đèn lên rồi, mở quán thôi!',w/2,h*.36,{size:Math.min(32,w/20),align:'center',color:'#fff1cb'});
  text('Nguyên liệu mang về từ sông',w/2,h*.44,{size:17,align:'center',color:'#ffe0be'});
  const cols = Math.max(1,Math.min(6,Math.floor(w/115))), size = Math.min(90,w/cols-12);
  t.items.forEach(([kind,count],i) => {
    const row = Math.floor(i/cols), n = Math.min(cols,t.items.length-row*cols);
    const x = w/2 + (i%cols-(n-1)/2)*(size+16), y = h*.55+row*110;
    ctx.fillStyle='rgba(20,25,42,.55)'; ctx.fillRect(x-size/2,y-35,size,95);
    itemSprite(kind,x,y-5,48);
    text('x'+count,x+size/2-7,y+15,{size:16,align:'right',color:'#fff0b4'});
    text(itemName(kind),x,y+45,{size:12,align:'center',color:'#fff1dd'});
  });
  if (!t.items.length) text('Giỏ chưa có nguyên liệu',w/2,h*.59,{size:18,align:'center',color:'#ffe0be'});
  text(t.switched ? 'Chào buổi tối · Quán Út Sen' : 'Chuẩn bị bếp và mang nguyên liệu vào kho…',w/2,h-40,{size:15,align:'center',color:'#ffe9cd'});
  ctx.restore();
}
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.mode === "quan") drawQuan(w, h); else drawGather(w, h);
    if(new URLSearchParams(location.search).has('debug'))eventLog(w, h);
    overlay(w, h);
    drawEveningTransition(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
document.getElementById('view-reservations').addEventListener('click',()=>{
  if(!snap)return;
  const total={};
  const rows=(snap.reservations||[]).map(r=>{
    const dish=snap.menu_catalog?.[r.dish_id],recipe=dish?.recipe||{};
    const remaining=Math.max(0,Math.ceil((r.arrival_tick-(snap.mode==='quan'?snap.elapsed||0:0))/60));
    const ingredients=Object.entries(recipe).map(([kind,count])=>{
      total[kind]=(total[kind]||0)+count;
      return `${itemName(kind)} ×${count}`;
    }).join(', ');
    return `<section style="padding:12px 0;border-bottom:1px solid #786749"><strong>${r.id} · Bàn ${r.table_id} · ${dishName(r.dish_id)}</strong><p>${snap.mode==='gather'?'Đến sau khi mở quán':'Còn'} ${remaining}s · ${r.state}</p><p>Nguyên liệu: ${ingredients}</p><small>Giá niêm yết ${dish?.price||0} xu · Đặt trước ×1,5, điều chỉnh theo độ tươi</small></section>`;
  }).join('');
  document.getElementById('reservations-content').innerHTML=rows+`<h3>Tổng nguyên liệu cho hai đơn</h3><p>${Object.entries(total).map(([kind,n])=>itemName(kind)+' ×'+n).join(', ')||'Chưa có đơn'}</p>`;
  down.clear();pushInput();
  document.getElementById('reservations-dialog').showModal();
});
requestAnimationFrame(frame);
</script>
